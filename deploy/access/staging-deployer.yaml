# Apply once with the existing cluster operator, after the staging namespace exists.
# The IAM deploy role's EKS access entry must map to carelink:staging-deployers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: carelink-deployer
  namespace: staging
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [services, serviceaccounts, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, events, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carelink-deployer
  namespace: staging
subjects:
  - kind: Group
    name: carelink:staging-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: carelink-deployer
  apiGroup: rbac.authorization.k8s.io
