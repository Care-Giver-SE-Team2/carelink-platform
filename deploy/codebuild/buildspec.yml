version: 0.2
phases:
  install:
    commands:
      - |
        set -eu
        cd /tmp
        curl -fsSLO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
        curl -fsSLO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
        echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
        install -m 0755 kubectl /usr/local/bin/kubectl
        curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
        curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
        tar -xzf helm-v4.3.0-linux-amd64.tar.gz
        install -m 0755 linux-amd64/helm /usr/local/bin/helm
  pre_build:
    commands:
      - |
        set -eu
        cd "$CODEBUILD_SRC_DIR"
        python3 -c 'import json,os,re; sha=os.environ["RELEASE_SHA"]; assert re.fullmatch(r"[0-9a-f]{40}",sha); r=json.load(open(".deployment/release.json")); assert all(v["tag"]==sha for v in r["services"].values())'
        export KUBECONFIG=/tmp/carelink-deploy-kubeconfig
        aws eks update-kubeconfig --region ap-southeast-1 --name carelink-runtime --alias carelink-codebuild-deploy --kubeconfig "$KUBECONFIG"
  build:
    commands:
      - |
        set -eu
        cd "$CODEBUILD_SRC_DIR"
        export KUBECONFIG=/tmp/carelink-deploy-kubeconfig
        export KUBE_CONTEXT=carelink-codebuild-deploy
        export RELEASE_MANIFEST="$CODEBUILD_SRC_DIR/.deployment/release.json"
        export PUBLIC_HTTPS=true
        bash scripts/deploy-release.sh staging
        bash scripts/deploy-public-ingress.sh
        echo "Deployed backend commit $RELEASE_SHA"
