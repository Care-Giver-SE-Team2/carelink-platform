# The local environment behind scripts/run.sh. The services run from the images
# scripts/build.sh builds, the same images the cloud runs; the managed cloud services are
# stood in for locally:
#   mysql       RDS for MySQL
#   redis       ElastiCache for Redis
#   localstack  SQS and SNS
# Passwords come from .env, which scripts/run.sh writes on first run and git ignores.
#
# A new service gets an entry like core's: its image, what it depends on, its settings.
name: carelink

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/run.sh, which writes .env}
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
    # Ping over TCP, not the socket: while MySQL initialises it runs a temporary
    # server that answers on the socket only, so a socket ping reports "healthy"
    # seconds before the real server accepts connections and the service then
    # dies with "Communications link failure".
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  # Each service's own database and account on the same server (scripts/mysql/service-databases.sh),
  # made again on every start so that a volume from before a service had its database gets it too
  mysql-setup:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/run.sh, which writes .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
    volumes:
      - ./scripts/mysql/service-databases.sh:/service-databases.sh:ro
    entrypoint: ["sh", "/service-databases.sh"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  localstack:
    # Pinned: 4.14.0 is the last image that starts without a LocalStack account. Later
    # images exit at start-up unless LOCALSTACK_AUTH_TOKEN is set.
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,sns
    volumes:
      # The events topic and each service's queue (libs/events; the cloud creates them with Terraform)
      - ./scripts/localstack/events.sh:/etc/localstack/init/ready.d/events.sh:ro
    healthcheck:
      # Healthy once the script above has run, not only once LocalStack answers
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | tr -d ' ' | grep -q '\"completed\":true'"]
      interval: 5s
      timeout: 3s
      retries: 24

  core:
    image: ${IMAGE_PREFIX:-carelink}/core:${IMAGE_TAG:-local}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/carelink?connectionTimeZone=Asia/Singapore
      DB_USER: carelink
      DB_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
      # Logins are kept in Redis, so any replica can serve any signed-in user
      SPRING_DATA_REDIS_HOST: redis
      # core publishes its events to the topic (docs/platform/event-catalogue.md). It handles
      # none yet, so it has no queue setting.
      CARELINK_EVENTS_TOPICARN: arn:aws:sns:ap-southeast-1:000000000000:carelink-events
      CARELINK_EVENTS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test             # LocalStack takes any key
      AWS_SECRET_ACCESS_KEY: test
      # Rostering and incident call visit's internal API. visit starts after core (it needs the
      # schema core migrates), so core's calls fail until visit is up: the scans that run every
      # minute try again, and the roster catch-up at start-up waits for the nightly run
      CARELINK_VISITAPI_BASEURL: http://visit:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  visit:
    image: ${IMAGE_PREFIX:-carelink}/visit:${IMAGE_TAG:-local}
    depends_on:
      # visit migrates its own database, which mysql-setup creates; core serves the internal API it calls
      mysql-setup:
        condition: service_completed_successfully
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/carelink_visit?connectionTimeZone=Asia/Singapore
      DB_USER: visit
      DB_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
      # The login made through core, read from the same Redis
      SPRING_DATA_REDIS_HOST: redis
      CARELINK_COREAPI_BASEURL: http://core:8080
      # visit publishes what happens to a visit to the topic; it handles no events, so it has no
      # queue setting
      CARELINK_EVENTS_TOPICARN: arn:aws:sns:ap-southeast-1:000000000000:carelink-events
      CARELINK_EVENTS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test             # LocalStack takes any key
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  report:
    image: ${IMAGE_PREFIX:-carelink}/report:${IMAGE_TAG:-local}
    depends_on:
      # report migrates its own database, which mysql-setup creates; core and visit serve the APIs it calls
      mysql-setup:
        condition: service_completed_successfully
      core:
        condition: service_healthy
      visit:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: api
      REPORT_LEGACY_SCHEDULER_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/carelink_report?connectionTimeZone=Asia/Singapore
      DB_USER: report
      DB_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
      # The login made through core, read from the same Redis
      SPRING_DATA_REDIS_HOST: redis
      CARELINK_COREAPI_BASEURL: http://core:8080
      CARELINK_VISITAPI_BASEURL: http://visit:8080
      # report's messages go out as events to the topic, and it keeps the facts its reports are made
      # from off its queue (visit's and core's events, docs/platform/event-catalogue.md)
      CARELINK_EVENTS_TOPICARN: arn:aws:sns:ap-southeast-1:000000000000:carelink-events
      CARELINK_EVENTS_QUEUEURL: http://localstack:4566/000000000000/carelink-report
      CARELINK_EVENTS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test             # LocalStack takes any key
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  report-worker:
    image: ${IMAGE_PREFIX:-carelink}/report:${IMAGE_TAG:-local}
    profiles: [worker]

    # Allow in-flight Bedrock jobs to finish during shutdown.
    stop_grace_period: 250s
    depends_on:
      mysql-setup:
        condition: service_completed_successfully
      core:
        condition: service_healthy
      visit:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${REPORT_WORKER_SPRING_PROFILES:-worker}
      REPORT_WORKER_TEST_PREPARE_DELAY: ${REPORT_WORKER_TEST_PREPARE_DELAY:-0s}
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      REPORT_LEGACY_SCHEDULER_ENABLED: "false"
      DB_URL: jdbc:mysql://mysql:3306/carelink_report?connectionTimeZone=Asia/Singapore
      DB_USER: report
      DB_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
      SPRING_DATA_REDIS_HOST: redis
      CARELINK_COREAPI_BASEURL: http://core:8080
      CARELINK_VISITAPI_BASEURL: http://visit:8080
      CARELINK_EVENTS_SERVICE: report-worker
      CARELINK_EVENTS_TOPICARN: arn:aws:sns:ap-southeast-1:000000000000:carelink-events
      CARELINK_EVENTS_QUEUEURL: http://localstack:4566/000000000000/carelink-report-worker
      CARELINK_EVENTS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  notification:
    image: ${IMAGE_PREFIX:-carelink}/notification:${IMAGE_TAG:-local}
    depends_on:
      # notification migrates its own database, which mysql-setup creates
      mysql-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/carelink_notification?connectionTimeZone=Asia/Singapore
      DB_USER: notification
      DB_PASSWORD: ${MYSQL_PASSWORD:?run scripts/run.sh, which writes .env}
      # The login made through core, read from the same Redis
      SPRING_DATA_REDIS_HOST: redis
      # Who reads the inbox, and which elders a family member may read
      CARELINK_COREAPI_BASEURL: http://core:8080
      # notification takes NotificationRequested from its queue (scripts/localstack/events.sh
      # subscribes the queue to that event only), and publishes ProviderUpdated to the topic
      CARELINK_EVENTS_QUEUEURL: http://localstack:4566/000000000000/carelink-notification
      CARELINK_EVENTS_TOPICARN: arn:aws:sns:ap-southeast-1:000000000000:carelink-events
      CARELINK_EVENTS_ENDPOINT: http://localstack:4566
      # Encrypts providers' webhook signing secrets and the Open Platform's token key in the database;
      # scripts/run.sh writes it to .env
      CARELINK_WEBHOOKS_ENCRYPTIONKEY: ${WEBHOOK_ENCRYPTION_KEY:?run scripts/run.sh, which writes .env}
      # Locally a provider's endpoint may be http:// or on this machine; never in the cloud
      CARELINK_WEBHOOKS_ALLOWLOCALENDPOINTS: "true"
      AWS_ACCESS_KEY_ID: test             # LocalStack takes any key
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  mysql-data:
