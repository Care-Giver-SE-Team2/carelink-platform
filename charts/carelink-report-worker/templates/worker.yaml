{{- if ne .Release.Namespace "staging" }}
{{- fail "The report worker integration is restricted to staging" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
{{- fail "Select the immutable report image digest from the complete release" }}
{{- end }}
{{- if not (has (int .Values.scaling.maxReplicas) (list 1 2)) }}
{{- fail "The initial report worker integration is limited to at most two replicas" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  labels:
    app.kubernetes.io/name: report-worker
spec:
  {{- if not .Values.scaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: report-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-worker
        app.kubernetes.io/part-of: carelink
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    spec:
      serviceAccountName: report-worker
      priorityClassName: carelink-report-worker
      terminationGracePeriodSeconds: 270
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: report-worker
      containers:
        - name: report-worker
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ .Values.image.digest }}"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: report-worker-runtime
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: worker
            - name: REPORT_LEGACY_SCHEDULER_ENABLED
              value: "false"
            - name: REPORT_TASK_PRODUCER_ENABLED
              value: "false"
            - name: CARELINK_EVENTS_SERVICE
              value: report-worker
            - name: CARELINK_EVENTS_REGION
              value: ap-southeast-1
            - name: CARELINK_REPORT_AI_ENABLED
              value: "false"
            - name: REPORT_WORKER_TEST_PREPARE_DELAY
              value: "0s"
            - name: CARELINK_COREAPI_BASEURL
              value: http://core
            - name: CARELINK_VISITAPI_BASEURL
              value: http://visit
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 240s
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca
              mountPath: /etc/carelink/rds
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rds-ca
          configMap:
            name: rds-ca
{{- if .Values.scaling.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: report-worker-sqs
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: report-worker
  annotations:
    autoscaling.keda.sh/paused: {{ .Values.scaling.paused | quote }}
spec:
  scaleTargetRef:
    name: report-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.scaling.maxReplicas }}
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: report-worker-sqs
      metadata:
        queueURL: {{ required "queueURL is required for KEDA" .Values.queueURL | quote }}
        awsRegion: ap-southeast-1
        queueLength: "1"
        activationQueueLength: "0"
        scaleOnInFlight: "true"
        scaleOnDelayed: "false"
{{- end }}
