apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "carelink-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  # Rolling update that never runs fewer replicas than asked for: a new pod must be ready
  # before an old one is stopped
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "carelink-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "carelink-service.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # Balance each revision across healthy zones. Failed, untolerated tainted
      # nodes do not keep an unavailable zone eligible; minDomains defaults to 1.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "carelink-service.selectorLabels" . | nindent 14 }}
      containers:
        - name: {{ .Release.Name }}
          {{- if .Values.image.digest }}
          {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
          {{- fail "image.digest must be a sha256 digest" }}
          {{- end }}
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.liveness }}
              port: http
            periodSeconds: 5
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.shutdown.preStopSeconds }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.rdsTruststoreConfigMap }}
            - name: rds-ca
              mountPath: /etc/carelink/rds
              readOnly: true
            {{- end }}
      volumes:
        # The only writable path: Tomcat's work directory and the JVM's temporary files
        - name: tmp
          emptyDir: {}
        {{- if .Values.rdsTruststoreConfigMap }}
        - name: rds-ca
          configMap:
            name: {{ .Values.rdsTruststoreConfigMap | quote }}
        {{- end }}
