{{- if ne (len .Values.privateSubnetIds) 2 }}
{{- fail "Supply the two private app subnet IDs from the reviewed runtime" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carelink-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/subnets: {{ join "," .Values.privateSubnetIds | quote }}
    alb.ingress.kubernetes.io/security-group-prefix-lists: {{ required "Supply the CloudFront origin-facing managed prefix list ID" .Values.cloudFrontPrefixListId | quote }}
    alb.ingress.kubernetes.io/use-regex-path-match: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/tags: Project=CareLink,Component=PublicIngress
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          {{- range .Values.routes }}
          - path: {{ .path | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .service }}
                port:
                  number: 80
          {{- end }}
