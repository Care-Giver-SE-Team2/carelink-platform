        not imply explicit acknowledgement. FULL/READ_ONLY do not imply different clinical field sets: both may
        use the family read projections below; an authorised family member may record their own incident
        view/acknowledgement under either scope because those commands record that family member's response, not
        a change to the elder care record. Notification read commands separately require ownership of the
        notification; no notification record is required for these incident operations.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie value in the
        X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied user ID or timestamp is
        accepted.
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Echo the current XSRF-TOKEN cookie; use the platform session/CSRF bootstrap flow.
        schema:
          type: string
          minLength: 1
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIncidentAcknowledgement'
      summary: Record the current family member viewing an incident
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 'Server-side session established by `POST /auth/login`. State-changing requests must also echo the `XSRF-TOKEN`
        cookie value in an `X-XSRF-TOKEN` header.

        '
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    ElderId:
      name: elderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CaregiverId:
      name: caregiverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ElderListItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
        - dateOfBirth
        - address
        - sector
        - planStatus
        - planVersion
        - nextVisitDate
      properties:
        id:
          type: integer
          format: int64
          description: Elder profile ID.
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        planStatus:
          type: string
          enum: [published, draft, none]
          description: Latest care plan state; absent, superseded or stopped plans are shown as none.
        planVersion:
          type: integer
          nullable: true
          description: Latest plan version; null when planStatus is none.
        nextVisitDate:
          type: string
          format: date
          nullable: true
          description: >-
            Next date derived from the published care plan on or after today, or null if none.
            This value does not establish that a dated visit record or caregiver assignment exists.

    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    CurrentUserResponse:
      type: object
