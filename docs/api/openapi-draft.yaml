            responders already let their countdown expire, not by how many empty tiers were
            stepped over.

            '
        state:
          type: string
          enum: [PENDING, CURRENT, TIMED_OUT, SKIPPED_UNAVAILABLE, CLAIMED]
    EscalationChain:
      type: object
      description: 'The escalation chain as it would be walked right now.

        It is assembled per request from the severity, from who has handled this elder
        before, and from who has already turned this incident down. It is deliberately not
        stored: asking twice can legitimately give different answers, which is why
        `assembledAt` is part of the answer. What happened, as opposed to what would happen,
        is in the incident timeline.

        CareLink does not roster its managers, so the chain never asks who is on call. The
        tiers are: the responder already named, the manager who handled this elder''s last
        incident, any enabled manager, and the terminal family escalation.

        '
      properties:
        incidentId:
          type: integer
          format: int64
        assembledAt:
          type: string
          format: date-time
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        assembledFrom:
          type: string
          description: The inputs the chain was built from, in words, for the manager's screen.
          example: severity HIGH, continuity tier included, 3 manager(s) enabled
        levels:
          type: array
          items:
            $ref: '#/components/schemas/EscalationLevel'
