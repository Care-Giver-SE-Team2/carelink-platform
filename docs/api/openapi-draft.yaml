          minimum: 0
        targetAddress:
          type: string
          maxLength: 255
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        postalCode:
          type: string
          maxLength: 10
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        mobilityLevel:
          $ref: '#/components/schemas/MobilityLevel'
        preferredDialects:
          type: string
          maxLength: 100
        careNeeds:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        medicalNotes:
          type: string
      description: >-
        Family submission only. Applicant identity, approval fields, status and elderId are set by the server,
        never by the caller.
      example:
        targetElderName: Tan Mei
        targetAddress: 12 Example Road
        postalCode: '123456'
        mobilityLevel: INDEPENDENT
        careNeeds:
        - BATHING
        - VITALS
      required:
      - targetElderName
      - targetAddress
      - postalCode
    FamilyIntakeApplication:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        applicantFamilyMemberId:
          type: integer
          format: int64
        targetElderName:
          type: string
        targetElderAge:
          type: integer
          nullable: true
        targetAddress:
          type: string
        postalCode:
          type: string
        mobilityLevel:
          $ref: '#/components/schemas/MobilityLevel'
        preferredDialects:
          type: string
          nullable: true
        careNeeds:
          type: array
          items:
            type: string
          description: An empty array when no requested tasks were supplied.
        medicalNotes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/IntakeStatus'
        reviewRemarks:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        elderId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Null until approval creates the formal elder record; this ID does not grant a family binding.
      required:
      - id
      - applicantFamilyMemberId
      - targetElderName
      - targetAddress
      - postalCode
      - status
      - createdAt
      - reviewedAt
      - reviewRemarks
      - elderId
    FamilyIntakeApplicationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyIntakeApplication'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
