    FamilyCaregiverView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        fullName:
          type: string
          minLength: 1
        dialects:
          type: array
          description: >-
            Dialects from the source comma-separated string. Items are trimmed and empty
            items omitted; order, spelling and duplicates are preserved. Null or blank
            source values produce an empty array.
          items:
            type: string
      description: >-
        Public profile only: id, fullName and dialects. No phone, user/account ID, sector,
        private contact details, staff performance, internal availability state or credentials.
      required:
        - id
        - fullName
        - dialects
    FamilyCredentialView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        caregiverId:
          type: integer
          format: int64
          minimum: 1
        credentialTypeId:
          type: integer
          format: int64
          minimum: 1
        credentialTypeName:
          type: string
          description: Name from the credential type catalogue.
        issuingBody:
          type: string
          nullable: true
        validFrom:
          type: string
          format: date
          nullable: true
          description: >-
            A future date means not yet effective, even when status is PUBLISHED or EXPIRING.
            The query preserves this date and does not introduce another status enum.
        expiryDate:
          type: string
          format: date
          description: >-
            Inclusive Singapore expiry date. 9999-12-31 denotes a permanent credential and
            remains in the response; display as no expiry while still considering validFrom
            and invalid statuses such as REVOKED or EXPIRED.
        status:
          type: string
          enum:
            - PUBLISHED
            - EXPIRING
            - EXPIRED
            - REVOKED
          description: >-
            Public display status. Stored PUBLISHED or EXPIRING is projected to EXPIRED when
            expiryDate is before the server's Singapore date. Stored REVOKED and EXPIRED are
            preserved. Other public statuses remain unchanged; no 30-day warning threshold
            is derived here. Current validity also depends on validFrom and expiryDate.
      description: >-
        Public projection of credentials whose stored status is PUBLISHED, EXPIRING, EXPIRED
        or REVOKED. SUBMITTED and REJECTED records, certificate numbers, reviewer details,
        renewal links and internal timestamps are excluded. All eight keys are returned,
        including nullable issuingBody and validFrom. The date-based status projection does
        not change the stored credential.
      required:
        - id
        - caregiverId
        - credentialTypeId
        - credentialTypeName
        - issuingBody
        - validFrom
        - expiryDate
        - status
    FamilyVisitView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        elderId:
          type: integer
          format: int64
        caregiverId:
          type: integer
          format: int64
          nullable: true
        serviceType:
          type: string
          nullable: true
          description: Source visit service type; null when not recorded.
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/VisitStatus'
        asOf:
          type: string
          format: date-time
          description: >-
            Server snapshot time for this read, shared by every item in the response; not the
            last modification time. A failed refresh must not advance it.
      description: >-
        Family service view. No absence record, internal state deadline, or care-plan implementation
        IDs. Null caregiverId means unassigned. Timestamps are RFC 3339 values with an explicit
        offset; visit times are interpreted in Asia/Singapore. Nullable source fields remain null.
      required:
      - id
      - elderId
      - caregiverId
      - serviceType
      - scheduledStart
      - scheduledEnd
      - checkedInAt
      - checkedOutAt
      - status
      - asOf
    FamilyVisitPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyVisitView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
    FamilyVisitTaskView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        visitId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        status:
          $ref: '#/components/schemas/VisitTaskStatus'
        completedAt:
          type: string
          format: date-time
          nullable: true
      description: >-
        Family-visible execution progress. SKIPPED and REFUSED are not DONE. Internal caregiver notes and
        unclassified outcomes are excluded.
      required:
      - id
      - visitId
      - name
      - status
      - completedAt
    FamilyVisitTimelineEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        visitId:
          type: integer
          format: int64
          minimum: 1
        fromState:
          $ref: '#/components/schemas/VisitStatus'
        toState:
          $ref: '#/components/schemas/VisitStatus'
        result:
          type: string
          enum:
          - APPLIED
        occurredAt:
          type: string
          format: date-time
      description: An applied service transition; rejected attempts and actor identifiers remain in the internal audit view.
      required:
      - id
      - visitId
      - fromState
      - toState
      - result
      - occurredAt
    FamilyReport:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        elderId:
          type: integer
          format: int64
        audience:
          type: string
          enum:
          - FAMILY
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        status:
          type: string
          enum:
          - PUBLISHED
          - ARCHIVED
        dataComplete:
          type: boolean
          description: false when the period had unclosed visits (2a); the gaps are listed in `missingItems`.
        missingItems:
          type: array
          items:
            type: string
          description: Family-safe descriptions of incomplete records; no other elders or staff-performance data.
        generatedBy:
          type: string
          enum:
          - MODEL
          - TEMPLATE
          description: FAMILY version only — TEMPLATE when the language model was unavailable (3a).
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
      description: Published or archived report metadata for a currently authorised family reader. Never DRAFT.
      required:
      - id
      - elderId
      - audience
      - periodStart
      - periodEnd
      - status
      - dataComplete
      - missingItems
      - generatedBy
      - createdAt
      - archivedAt
    FamilyReportPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyReport'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
    ReportFigure:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
          example: visits
        label:
          type: string
          example: Visits carried out
        value:
          type: number
          example: 2
        outOf:
          type: number
          nullable: true
          example: 3
        unit:
          type: string
          nullable: true
          description: '"%" for a rate; null otherwise.'
    ReportSeries:
      type: object
      required: [key, label, points]
      properties:
        key:
          type: string
          example: systolic
        label:
          type: string
          example: Systolic
        unit:
          type: string
          nullable: true
          example: mmHg
        points:
          type: array
          items:
            $ref: '#/components/schemas/ReportPoint'
    ReportPoint:
      type: object
      required: [at, low, high, flagged]
      properties:
        at:
          type: string
          description: ISO-8601 local date-time for a reading ("2026-09-14T09:10"), or a date for a day's range ("2026-09-14").
        low:
          type: number
        high:
          type: number
          description: Equal to low for a single reading.
        flagged:
          type: boolean
          description: A reading behind the point was flagged out of range when it was entered.
    FamilyReportSection:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          description: Stable chapter key, derived from its title for legacy reports.
        title:
          type: string
          minLength: 1
        body:
          type: string
        figures:
          type: array
          items:
            $ref: '#/components/schemas/ReportFigure'
        series:
          type: array
          description: FAMILY daily ranges only; never individual timestamped readings from other audiences.
          items:
            $ref: '#/components/schemas/ReportSeries'
      description: >-
        Saved FAMILY chapters including Overview, Services and Ratings and spot checks.
        No internal basis, staff identifiers, medical notes or inspection findings are exposed.
        Legacy reports retain their original text with empty figures and series.
      required: [key, title, body, figures, series]
    FamilyReportAmendment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [CORRECTION, FOLLOW_UP]
          description: Older notes default to CORRECTION.
        note:
          type: string
        createdAt:
          type: string
          format: date-time
      description: A family-safe correction or follow-up; internal author identifiers are not exposed.
      required: [id, kind, note, createdAt]
    FamilyReportDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        elderId:
          type: integer
          format: int64
        audience:
          type: string
          enum:
          - FAMILY
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        status:
          type: string
          enum:
          - PUBLISHED
          - ARCHIVED
        dataComplete:
          type: boolean
          description: false when the period had unclosed visits (2a); the gaps are listed in `missingItems`.
        missingItems:
          type: array
          items:
            type: string
          description: Family-safe descriptions of incomplete records; no other elders or staff-performance data.
        generatedBy:
          type: string
          enum:
          - MODEL
          - TEMPLATE
          description: FAMILY version only — TEMPLATE when the language model was unavailable (3a).
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
        sections:
          type: array
          items:
            $ref: '#/components/schemas/FamilyReportSection'
        disclaimer:
          type: string
          enum:
          - This summary records care observations and services; it is not a diagnosis or medical advice.
        amendments:
          type: array
          items:
            $ref: '#/components/schemas/FamilyReportAmendment'
      description: >-
        Immutable report content read under current authorisation. Empty amendments is [], and a non-null
        disclaimer is always present.
      required:
      - id
      - elderId
      - audience
      - periodStart
      - periodEnd
      - status
      - dataComplete
      - missingItems
      - generatedBy
      - createdAt
      - archivedAt
      - sections
      - disclaimer
      - amendments
    FamilyWeeklySummary:
      type: object
      additionalProperties: false
      properties:
        reportId:
          type: integer
          format: int64
          minimum: 1
        elderId:
          type: integer
          format: int64
          minimum: 1
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        summaryText:
          type: string
          minLength: 1
        generatedBy:
          type: string
          enum:
          - MODEL
          - TEMPLATE
        disclaimer:
          type: string
          enum:
          - This summary records care observations and services; it is not a diagnosis or medical advice.
      description: >-
        Fixed-format TEMPLATE text from the selected existing FAMILY report's visible chapters.
        Each title and original body are separated by a newline; chapters are separated by a blank
        line. reportId links to the detail containing completeness, missing items and corrections.
        Does not trigger report or model generation.
      example:
        reportId: 410
        elderId: 12
        periodStart: '2026-09-07'
        periodEnd: '2026-09-13'
        summaryText: "Service completion\nThree visits were completed this week.\n\nObservations\nWalked two laps."
        generatedBy: TEMPLATE
        disclaimer: This summary records care observations and services; it is not a diagnosis or medical advice.
      required:
      - reportId
      - elderId
      - periodStart
      - periodEnd
      - summaryText
      - generatedBy
      - disclaimer
    FamilyIncidentAcknowledgement:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Null in a detail read before a view/acknowledgement record is created. Non-null after a successful
            view or acknowledge command.
        incidentId:
          type: integer
          format: int64
          minimum: 1
        familyMemberId:
          type: integer
          format: int64
          minimum: 1
        viewedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        responseNote:
          type: string
          maxLength: 255
          nullable: true
      description: >-
        Current family member only. Viewed and acknowledged timestamps are independent and preserve their first
        server-recorded values.
      required:
      - id
      - incidentId
      - familyMemberId
      - viewedAt
      - acknowledgedAt
      - responseNote
    FamilyIncidentDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        elderId:
          type: integer
          format: int64
        visitId:
          type: integer
          format: int64
          nullable: true
        source:
          $ref: '#/components/schemas/IncidentSource'
        category:
          $ref: '#/components/schemas/IncidentCategory'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        description:
          type: string
          nullable: true
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgeBy:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null without an FM05 personal window; legacy notifications do not establish one.
            The family member response deadline: first successfully created urgent IN_APP notification
            for this incident/family member plus the configured window (default two hours). Null when no response window
            was established, including when notification creation has not succeeded; null does not prevent an
            authorised read, view or acknowledgement. Stable across polling, email retries and further
            notifications for the same incident. Never the manager respondBy deadline. Later notification creation
            does not clear an existing acknowledgement or reopen waiting reminders.
        acknowledgement:
          $ref: '#/components/schemas/FamilyIncidentAcknowledgement'
      description: >-
        Safe incident facts and global handling status for the currently authorised family member. Notification
        existence or delivery is not an access prerequisite. No raw location coordinates, playbook, internal log,
        staff account IDs or other family acknowledgements.
      required:
      - id
      - elderId
      - visitId
      - source
      - category
      - severity
      - status
      - description
      - reportedAt
      - resolvedAt
      - acknowledgeBy
      - acknowledgement
    FamilyIncidentAcknowledgeRequest:
      type: object
      additionalProperties: false
      properties:
        responseNote:
          type: string
          maxLength: 255
      description: >-
        Optional first-acknowledgement note. Caller identity and timestamps cannot be supplied. Repeated
        acknowledgements preserve the first note.
    FamilyNotification:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        elderId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Derived from the linked care resource. Null only for a notification about the account itself, never a
            bypass for unauthorised care content.
        eventType:
          type: string
        channel:
          type: string
          enum:
          - IN_APP
        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 1000
          nullable: true
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
          - SENT
          - READ
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
      description: >-
        A displayable in-app notification for the current user. SENT means available in the inbox, not email
        delivery. For an incident link, resourceType is incident and resourceId is the incident ID, not the
        notification ID.
      example:
        id: 901
        elderId: 12
        eventType: INCIDENT_RAISED
        channel: IN_APP
        title: An urgent care incident was reported
        body: Open the incident to view details and acknowledge.
        resourceType: incident
        resourceId: 77
        status: SENT
        createdAt: '2026-09-09T10:00:00+08:00'
        sentAt: '2026-09-09T10:00:00+08:00'
        readAt: null
      required:
      - id
      - elderId
      - eventType
      - channel
      - title
      - body
      - resourceType
      - resourceId
      - status
      - createdAt
      - sentAt
      - readAt
    FamilyNotificationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyNotification'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
  responses:
    Unauthorized:
      description: No active session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated, but not permitted to act on this resource (e.g. an elder outside the caller's scope).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: No resource with this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The request is well-formed but illegal in the resource's current state (e.g. an out-of-order visit transition).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ProblemDetail'
            - type: object
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: Field name to validation message.
    FamilyUnauthorized:
      description: No valid authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyForbidden:
      description: >-
        The current caller lacks the family role, resource ownership, recipient identity, or a currently active,
        unexpired binding/access scope. An authenticated caller does not gain access by changing an ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyNotFound:
      description: >-
        The requested resource does not exist, or no readable report exists for the requested week. Empty
        collections use 200 with an empty array or page items array instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyValidationError:
      description: >-
        Invalid input, date range, week start, unexpected request field, or unsupported family filter. Optional
        fields maps field names to validation messages.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyAuditUnavailable:
      description: >-
        The family access record could not be committed. After any query outcome, failure to
        record access returns 503 instead of the result or original error, without protected data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Access recording unavailable
            status: 503
            detail: Access could not be recorded. Please retry later.
    FamilyServiceUnavailable:
      description: >-
        Report rendering is temporarily unavailable. The authorised online report remains readable; retrying
        export does not regenerate the report.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
security:
- sessionCookie: []
