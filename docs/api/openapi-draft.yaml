        of these commands. Waiting reminders are not implemented.
        An absent body, empty object or null responseNote means no note. Preserve the
        first note, including null or empty text; do not trim it. Accept only a string
        or null responseNote up to 255 characters; reject unknown fields and other types.

        For FAMILY, authorise access using the authenticated family identity, an ACTIVE and unexpired binding to
        the actual incident elder, and the applicable access scope. Derive the current familyMemberId from the
        session; the caller cannot choose another family member. The existence, delivery success or read state of
        a notification is not an authorisation condition. An otherwise authorised family member may read the
        incident and record their own view or acknowledgement even if no IN_APP notification exists or
        notification creation/delivery failed. Urgent alerts cannot be disabled through optional subscription
        preferences; that rule never overrides binding/access checks. The response window starts with the first
        successful urgent IN_APP notification creation for this incident/recipient and uses the configured
        interval (default two hours); further notices, polling and email retries do not reset it. GET
        /family/incidents/{id} returns acknowledgeBy, which is null when no response window has been established. A
        missing or failed notification does not block reading, viewing or acknowledging the incident. Later
        notification creation must preserve any already-recorded acknowledgement and must not restart waiting
        reminders for that family member. This recipient window is independent of manager incident status,
        respondBy and escalation. FAMILY-only explicit acknowledgement. Accept an optional responseNote up to 255
        characters. Atomically create/update one record per incident/family pair. The first accepted request fixes
        acknowledgedAt and responseNote; repeated/concurrent requests return 200 with the original values, even if
        a retry carries a different note. The command does not fabricate viewedAt or mark another notification
        read. Once waiting reminders are implemented, acknowledgement stops further waiting reminders for this recipient only. Late acknowledgements,
        including after incident resolution, are recorded at their true server time while access remains valid;
        they do not undo prior escalation, alter incident.status, resolve the incident or stop the manager
        escalation chain.


        Family callers are identified from the authenticated session, never a caller-supplied familyMemberId. For
        family callers, care resources require an ACTIVE binding to their actual elder, with no revocation and no
        elapsed expiresAt, and the applicable access scope at request time. Revocation/expiry takes effect on
        subsequent reads and writes, including historical content. Reading a family care resource records the
        caller, resource and server access time in the internal audit trail. Read access alone does not imply
        explicit acknowledgement. FULL/READ_ONLY do not imply different clinical field sets: both may use the
        family read projections below; an authorised family member may record their own incident
        view/acknowledgement under either scope because those commands record that family member's response, not a
        change to the elder care record. Notification read commands separately require ownership of the
        notification; no notification record is required for these incident operations.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie value in the
        X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied user ID or timestamp is
        accepted.
