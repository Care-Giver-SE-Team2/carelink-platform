openapi: 3.0.3
info:
  title: CareLink API
  description: 'This is a spec-first (design-first) API contract: it is hand-written and

    reviewed before the corresponding backend endpoint is implemented. It is

    the source of truth for the HTTP contract — controllers must match it,

    not the other way around.


    Historical design snapshot. The three caregiver read operations (GET /caregivers/me,
    GET /caregivers/me/schedule and GET /visits/{visitId}/work-pack) are now implemented;
    their authoritative contract is openapi.yaml, not their older shapes in this draft.

    At the time of this draft, only the `Auth` group was backed by a controller. Every

    other group is a draft: agreed enough to shape the frontend and the

    schema, but not yet implemented, and open to change as each feature

    module is actually built. Draft operations carry `x-status: draft` in

    this file; implemented ones carry `x-status: implemented`.

    '
  version: 0.0.1
  license:
    name: UNLICENSED
servers:
- url: /api
  description: Same-origin, relative to whichever host serves the front end.
tags:
- name: Auth
  description: Session-based sign-in and identity.
- name: Elders
  description: Elder profiles and the family bindings that link them to family accounts.
- name: Family members
  description: 'A family member is an independent account holder, not an attribute of one elder — the relationship to an elder
    lives entirely in the family binding, so one family member can look after more than one elder.

    '
- name: Care plans
  description: 'The care plan tree (UC-MG01). A plan is versioned; a node is either a TASK or a SUB_PLAN, and a SUB_PLAN''s
    effort is the rolled-up sum of its children, to any depth.

    '
- name: Intake
  description: Family-submitted applications that, once approved, provision an elder profile (UC-FM01).
- name: Caregivers
  description: Caregiver accounts, certifications and self-service schedule (UC-MG02, UC-MG06, UC-CG01).
- name: Leave
  description: Absence reporting and the re-rostering it triggers (UC-CG02, UC-MG04).
- name: Rostering
  description: 'Composing a roster (UC-MG03). The objective is a Strategy chosen per run; the run keeps every candidate considered,
    not only the outcome, so "why wasn''t this caregiver suggested" is answerable after the fact.

    '
- name: Visits
  description: 'Executing and closing a visit (UC-CG03, UC-CG05). Legal transitions and required evidence both depend on the
    visit''s service type; illegal transitions are refused and recorded, never silently dropped.

    '
- name: Incidents
  description: 'Care exceptions (UC-CG04, UC-MG05, UC-FM05). The escalation chain is assembled at the moment it''s needed
    from the severity and from who already knows the elder — there is no fixed chain to configure.

    '
- name: Spot checks
  description: Manager-initiated home service spot checks and the family's approval of them (UC-MG08, UC-FM07).
- name: Reports
  description: Periodic, audience-filtered reports and the family's weekly plain-language summary (UC-MG07, UC-FM04).
- name: Value-added services
  description: Non-billable service requests — intent and a work order only, never a charge (UC-EL02, UC-FM08).
- name: Reviews
  description: Family ratings of a caregiver and the renewal decision that follows (UC-FM09).
- name: Emergency
  description: The elder's one-tap SOS (UC-EL03) — bypasses the ordinary incident queue entirely.
- name: Notifications
  description: In-application and email notifications (no push infrastructure is in scope).
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Initialise browser CSRF protection
      x-status: implemented
      description: >-
        Call before login to obtain the XSRF-TOKEN cookie. Send that cookie and echo its value in
        the X-XSRF-TOKEN header for login and subsequent state-changing requests. This endpoint
        does not authenticate the caller.
      security: []
      responses:
        '200':
          description: CSRF token initialised; no response body.
          headers:
            Set-Cookie:
              description: XSRF-TOKEN cookie readable by the browser application.
              schema:
                type: string

  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in
      x-status: implemented
      description: 'Starts a server-side session on success. The session is carried by an HttpOnly `JSESSIONID` cookie set
        on the response; the front end does not read or manage it directly.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`JSESSIONID`) and CSRF cookie (`XSRF-TOKEN`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 'Invalid username or password. The two cases are not distinguished, so this response cannot be used
            to enumerate accounts.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Sign out
      x-status: implemented
      description: Ends the current session and clears the `JSESSIONID` cookie.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Get the current user
      x-status: implemented
      description: 'Returns the identity of the caller associated with the current session. The front end uses `roles` to
        decide which screens to show.

        '
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /elders:
    get:
      tags: [Elders]
      summary: List elders
      operationId: listElders
      x-status: implemented
      x-family-use-cases: [UC-FM02]
      security:
        - sessionCookie: []
      description: >-
        MANAGER callers receive every elder. FAMILY callers receive only elders linked to their
        current family profile by an ACTIVE binding with FULL or READ_ONLY access. The family
        account must currently be enabled and hold FAMILY. A binding is readable when expiresAt
        is absent or strictly later than the current time in Asia/Singapore; pending, rejected,
        revoked and expired bindings grant no access. Authorization is checked on every request.

        Both roles receive the same array of elder summaries. A family member with no readable
        elders receives 200 with an empty array. This operation has no pagination, search or sector
        filters. Identity comes from the authenticated session; no family ID or role parameter is
        accepted. This read-only GET requires no CSRF header.

        Validated requests reaching the FAMILY application query persist a READ record with
        the actor app_user ID (when resolvable), resource and outcome: OK, including empty
        results; DENIED for access refusal; or FAILED for lookup/query errors. Records
        commit independently with server occurred_at in Asia/Singapore. Authentication 401,
        method-role rejection 403 and MVC validation/conversion 400 rejected before the
        FAMILY application query are outside this audit. Existing request logging is
        unchanged. Audit storage failure returns 503 without protected data. Records
        exclude response bodies, raw query strings, exception details and secrets. Reading
        does not acknowledge notifications or incidents. The resource is ELDER with a null
        collection ID. MANAGER reads retain their existing behavior and are outside this
        family audit.
      responses:
        '200':
          description: Elder summaries visible to the current caller; an empty result is an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElderListItemResponse'
              examples:
                elders:
                  summary: Two readable elders, with and without a care plan
                  value:
                    - id: 101
                      fullName: Tan Mei
                      dateOfBirth: '1946-05-12'
                      address: 12 Example Road
                      sector: Central
                      planStatus: published
                      planVersion: 2
                      nextVisitDate: '2026-09-24'
                    - id: 102
                      fullName: Lim Wei
                      dateOfBirth: null
                      address: null
                      sector: null
                      planStatus: none
                      planVersion: null
                      nextVisitDate: null
                empty:
                  summary: No readable elders
                  value: []
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            The caller lacks a permitted role, or the family account is disabled, no longer
            holds FAMILY or has no family profile.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          $ref: '#/components/responses/FamilyAuditUnavailable'
    post:
      tags:
      - Elders
      summary: Establish elder profile and care plan
      x-status: draft
      description: 'UC-MG01. Establishes the elder profile. Usually called after an intake application is approved, rather
        than directly.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElderCreateRequest'
      responses:
        '201':
          description: Elder created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /elders/{elderId}:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Elders
      summary: Get an elder profile
      x-status: draft
      responses:
        '200':
          description: Elder detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Elders
      summary: Update an elder profile
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElderUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /elders/{elderId}/care-plan:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Care plans
      summary: Get the current care plan
      x-status: draft
      description: 'Returns the published plan as a node tree. `weeklyHours` on a SUB_PLAN node is computed server-side as
        the sum of its subtree, the same way it is for a single TASK node — a whole sub-plan must count toward the effort
        total the same way a single task does.

        '
      responses:
        '200':
          description: Care plan with its node tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlan'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Care plans
      summary: Replace the care plan
      x-status: draft
      description: 'Publishes a new version of the plan. The previous PUBLISHED version is marked SUPERSEDED and kept, never
        edited in place — a visit already in flight points at the version that was in force when it was created (see `Visit.carePlanId`).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarePlanReplaceRequest'
      responses:
        '200':
          description: New plan version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlan'
        '400':
          $ref: '#/components/responses/ValidationError'
  /elders/{elderId}/care-plan/nodes/{nodeId}/children:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    - name: nodeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Care plans
      summary: Add a task or sub-plan node
      x-status: draft
      description: Adds one child under an existing node, at any depth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarePlanNodeCreateRequest'
      responses:
        '201':
          description: Node added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlanNode'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /elders/{elderId}/care-plan/nodes/{nodeId}:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    - name: nodeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      tags:
      - Care plans
      summary: Remove a node and its subtree
      x-status: draft
      responses:
        '204':
          description: Node (and any descendants) removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /elders/{elderId}/family-bindings:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Elders
      summary: List family bindings for an elder
      x-status: draft
      responses:
        '200':
          description: Bindings, including pending ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElderFamilyBinding'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BindingStatus'
    post:
      tags:
      - Elders
      summary: Propose a family binding
      x-status: draft
      description: 'UC-FM10, UC-EL04. Either the elder or a family member can initiate; the binding sits `PENDING_CONFIRMATION`
        until the other party confirms it via `POST /family-bindings/{bindingId}/confirm`. The elder side issues a six-digit
        pairing code out of band for the family member to enter.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyBindingCreateRequest'
      responses:
        '201':
          description: Binding proposed, awaiting confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderFamilyBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
  /family-bindings/{bindingId}/confirm:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Elders
      summary: Confirm a proposed family binding
      x-status: draft
      description: The party that did not initiate confirms; the binding becomes ACTIVE.
      responses:
        '200':
          description: Binding active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderFamilyBinding'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /family-bindings/{bindingId}:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      tags:
      - Elders
      summary: Revoke a family binding
      x-status: draft
      responses:
        '204':
          description: Binding revoked.
        '404':
          $ref: '#/components/responses/NotFound'
  /family-members/me:
    get:
      tags:
      - Family members
      summary: Get my family member profile
      x-status: draft
      description: 'The caller''s own profile. A family member is a standalone account holder — this endpoint has no elder-scoped
        variant, since which elders a family member sees is entirely a matter of their bindings (`GET /elders`), not of this
        profile.

        '
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Family members
      summary: Update my family member profile
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyMemberUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMember'
        '400':
          $ref: '#/components/responses/ValidationError'
  /intake-applications:
    get:
      tags:
      - Intake
      summary: List intake applications
      x-status: draft
      x-family-status: implemented
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/IntakeStatus'
      responses:
        '200':
          description: >-
            The implemented family list uses FamilyIntakeApplicationPage. The original response schema
            is retained for the manager review list, whose implementation is pending.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FamilyIntakeApplicationPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntakeApplication'
                    page:
                      type: integer
                    size:
                      type: integer
                    totalElements:
                      type: integer
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          $ref: '#/components/responses/FamilyForbidden'
      x-contract-status: specified
      x-family-use-cases:
      - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
      - sessionCookie: []
      operationId: listIntakeApplications
      description: >-
        Family callers see only applications they submitted, including review status and family-visible remarks.
        Order by createdAt descending, then id descending. Empty results and pages beyond the last page
        return 200 with items=[]. Filter by applicant and optional status before pagination and totalElements
        counting. Page defaults to 0; size defaults to 20 and accepts 1 through 200. Invalid pagination or
        status values return 400.


        Family identity is resolved from the session. The account must currently be enabled, hold FAMILY
        and have a family profile. No existing elder or active binding is required. A family account with
        additional roles still receives only its own applications. This read-only GET requires a valid session
        but no CSRF header. The manager review-list contract is retained; its implementation is pending
        and non-FAMILY callers currently receive 403.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplicationPage'
    post:
      tags:
      - Intake
      summary: Submit an intake application
      x-status: implemented
      description: >-
        Submit an intake application as the current family member. Trim required text and reject blanks. Omitted
        mobilityLevel uses INDEPENDENT. Success creates only the application in SUBMITTED and returns 201; it does
        not create an elder, care plan or binding. Approval belongs to MG01. The initial contract does not promise
        request-level idempotency: after an ambiguous network failure, query the caller's applications before
        explicitly resubmitting rather than automatically retrying the POST.


        Family identity is resolved from the session. No existing elder or active binding is required to submit or
        read the caller's own intake application. Family reads/writes are restricted to that applicant.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie value in the
        X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied user ID or timestamp is
        accepted.
        New application creation times are generated in UTC and returned with an explicit timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyIntakeApplicationCreateRequest'
      responses:
        '201':
          description: Successful family operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyIntakeApplication'
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            Missing/invalid CSRF protection or insufficient family access. Shared security may
            reject the request before MVC runs; a ProblemDetail body is not guaranteed.
            Clients must handle the HTTP status even when no JSON body is returned.
      x-contract-status: specified
      x-use-cases:
      - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
      - sessionCookie: []
      operationId: familyPostIntakeApplications
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Echo the current XSRF-TOKEN cookie; use the platform session/CSRF bootstrap flow.
        schema:
          type: string
          minLength: 1
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplication'
  /intake-applications/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Intake
      summary: Get an intake application
      x-status: draft
      x-family-status: implemented
      responses:
        '200':
          description: >-
            The implemented family detail view uses FamilyIntakeApplication. The original response schema
            is retained for the manager detail view, whose implementation is pending.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FamilyIntakeApplication'
                - $ref: '#/components/schemas/IntakeApplication'
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-contract-status: specified
      x-family-use-cases:
      - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
      - sessionCookie: []
      operationId: getIntakeApplication
      description: >-
        Read the current family member's application and its review progress in any of the four application
        statuses. Another applicant's ID returns 403; a nonexistent application returns 404. The path ID
        must fit a signed 64-bit integer; malformed or overflowing values return 400. The response elderId
        is null until approval links a formal elder. An approved application is not an active binding.
        Reading the application does not change its status or review fields.


        Family identity is resolved from the session. The account must currently be enabled, hold FAMILY
        and have a family profile. No existing elder or active binding is required. A family account with
        additional roles still reads only its own applications. This read-only GET requires a valid session
        but no CSRF header. The manager detail contract is retained; its implementation is pending and
        non-FAMILY callers currently receive 403.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplication'
  /intake-applications/{id}/decision:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Intake
      summary: Approve or reject an intake application
      x-status: draft
      description: Approving provisions the elder profile via `POST /elders` internally and returns its id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
                remarks:
                  type: string
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeApplication'
        '409':
          $ref: '#/components/responses/Conflict'
  /caregivers:
    get:
      tags:
      - Caregivers
      summary: List caregivers
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sector
        in: query
        schema:
          type: string
      - name: dialect
        in: query
        schema:
          type: string
      - name: credentialTypeId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Page of caregivers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Caregiver'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
    post:
      tags:
      - Caregivers
      summary: Assign caregiver account
      x-status: draft
      description: UC-MG02. Creates the caregiver profile; certifications are attached separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverCreateRequest'
      responses:
        '201':
          description: Caregiver created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
        '400':
          $ref: '#/components/responses/ValidationError'
  /caregivers/{caregiverId}:
    parameters:
    - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
        - Caregivers
      summary: Get a caregiver profile
      x-status: draft
      x-family-status: implemented
      responses:
        '200':
          description: >-
            The implemented FAMILY response contains only FamilyCaregiverView fields. The
            original Caregiver response is retained for other roles, whose implementation is
