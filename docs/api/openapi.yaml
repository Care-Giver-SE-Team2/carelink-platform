      summary: The family answers a change
      description: >-
        Keep the suggestion or pick another of the options, move the visit, or skip it. The chosen
        caregiver is checked again against the roster as it is now; if they are no longer free the
        best available takes the visit and the note says so. 403 for an elder the caller is not bound
        to; 409 ROSTER_CHANGE_NOT_OPEN when already settled, FAMILY_WINDOW_CLOSED after the deadline
        (the default plan applies), NOT_ONE_OF_THE_OPTIONS, NEW_TIME_TOO_SOON, ELDER_BUSY_THEN or
        NOBODY_FREE_THEN for a move.
      operationId: decideRosterChange
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyDecisionRequest'
      responses:
        '200':
          description: The change as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRosterChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks:
    get:
      tags:
        - Spot checks
      summary: The spot checks the caller may see (UC-MG08)
      description: >-
        A manager sees every spot check and may narrow by stage, caregiver or elder. A family member
        sees those of the elders they have an active binding to, waiting ones first (the former
        UC-FM07). A caregiver sees their own concluded checks only; a request is not announced to
        the person being checked.
      operationId: listSpotChecks
      x-status: implemented
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            enum: [AWAITING_FAMILY, SCHEDULED, DECLINED, COMPLETED, CAREGIVER_NO_SHOW, WITHDRAWN]
        - name: caregiverId
          in: query
          schema: {type: integer, format: int64}
        - name: elderId
          in: query
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Spot checks, latest visit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpotCheckView'
      security:
        - sessionCookie: []
    post:
      tags:
        - Spot checks
      summary: Ask to watch a visit (UC-MG08 steps 1-2)
      description: >-
        The visit must not have started and must have a caregiver; the family is asked. 409
        SPOT_CHECK_ALREADY_REQUESTED while the visit has an open request, SPOT_CHECK_VISIT_NOT_OPEN
        for a visit already under way or called off.
      operationId: requestSpotCheck
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, purpose]
              properties:
                visitId: {type: integer, format: int64}
                purpose: {type: string, maxLength: 255}
      responses:
        '201':
          description: The request, waiting for the family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks/visits:
    get:
      tags:
        - Spot checks
      summary: The elder's visits a manager may choose to check
      operationId: listVisitsToCheck
      x-status: implemented
      parameters:
        - name: elderId
          in: query
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Visits with a caregiver that have not started, in the next two weeks.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    visitId: {type: integer, format: int64}
                    start: {type: string, format: date-time}
                    serviceType: {type: string, nullable: true}
                    caregiverId: {type: integer, format: int64}
                    caregiverName: {type: string}
      security:
        - sessionCookie: []
  /spot-checks/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/SpotCheckId'
    post:
      tags:
        - Spot checks
      summary: The family agrees, or declines and says why (UC-MG08 step 3 and 3a)
      description: >-
        Only a family member with an active binding to the elder (403 otherwise), only while the
        request waits for them, and only before the visit starts (409 SPOT_CHECK_TIME_PASSED). A
        decline needs a reason (409 SPOT_CHECK_REASON_REQUIRED).
      operationId: decideSpotCheck
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: {type: boolean}
                reason: {type: string, maxLength: 255}
      responses:
        '200':
          description: The check as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks/{id}/conclusion:
    parameters:
      - $ref: '#/components/parameters/SpotCheckId'
    post:
      tags:
        - Spot checks
      summary: Record the conclusion on site (UC-MG08 steps 4-5)
      description: 409 SPOT_CHECK_NOT_APPROVED while the family has not agreed.
      operationId: concludeSpotCheck
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {type: string, enum: [MEETS_STANDARD, NEEDS_IMPROVEMENT]}
                notes: {type: string, maxLength: 500}
      responses:
        '200':
          description: The concluded check; the family and the caregiver are told.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks/{id}/no-show:
    parameters:
      - $ref: '#/components/parameters/SpotCheckId'
    post:
      tags:
        - Spot checks
      summary: The caregiver did not turn up (UC-MG08 exception 4a)
      description: The check closes and the missed visit becomes an incident in the exception queue (UC-MG05).
      operationId: reportSpotCheckNoShow
      x-status: implemented
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: {type: string, maxLength: 500}
      responses:
        '200':
          description: The closed check, with the incident id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks/{id}/move:
    parameters:
      - $ref: '#/components/parameters/SpotCheckId'
    post:
      tags:
        - Spot checks
      summary: The elder was out; move the check to another of their visits (UC-MG08 exception 4b)
      description: >-
        Not held against the caregiver. The family is asked again, because they agreed to a time.
        409 SPOT_CHECK_OTHER_ELDER for another elder's visit.
      operationId: moveSpotCheck
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId]
              properties:
                visitId: {type: integer, format: int64}
      responses:
        '200':
          description: The moved check, waiting for the family again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks/{id}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/SpotCheckId'
    post:
      tags:
        - Spot checks
      summary: Withdraw an open request, with the reason
      operationId: withdrawSpotCheck
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 255}
      responses:
        '200':
          description: The withdrawn check; the family is told.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /spot-checks/{id}/response:
    parameters:
      - $ref: '#/components/parameters/SpotCheckId'
    post:
      tags:
        - Spot checks
      summary: The checked caregiver answers the conclusion
      description: 409 SPOT_CHECK_NOT_YOURS for anybody but the caregiver who was checked.
      operationId: respondToSpotCheck
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: {type: string, maxLength: 500}
      responses:
        '200':
          description: The check with the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheckView'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
  /caregivers/{caregiverId}/spot-checks:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
        - Spot checks
      summary: The concluded checks on a caregiver's record (UC-MG08 step 5)
      operationId: listCaregiverSpotChecks
      x-status: implemented
      responses:
        '200':
          description: Concluded checks, latest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpotCheckView'
      security:
        - sessionCookie: []
components:
  schemas:
    FamilyServiceApplicationCreate:
      type: object
      additionalProperties: false
      required: [elderId, careNeeds]
      properties:
        elderId: {type: integer, format: int64, minimum: 1}
        careNeeds:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 100}
        notes: {type: string, nullable: true, maxLength: 2000}
    FamilyServiceApplication:
      type: object
      required: [id, elderId, elderSnapshot, careNeeds, status, createdAt]
      properties:
        id: {type: integer, format: int64}
        elderId: {type: integer, format: int64}
        elderSnapshot: {$ref: '#/components/schemas/FamilyElderBasicDetails'}
        careNeeds: {type: array, items: {type: string}}
        notes: {type: string, nullable: true}
        status: {type: string, enum: [SUBMITTED]}
        createdAt: {type: string, format: date-time, description: 'Submission time with UTC offset.'}
    FamilyServiceApplicationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FamilyServiceApplication'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    FamilyElderBasicDetails:
      type: object
      required: [fullName]
      properties:
        fullName: {type: string, minLength: 1, maxLength: 100}
        gender: {type: string, nullable: true, enum: [MALE, FEMALE, OTHER]}
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Must not be later than today.
        phone: {type: string, nullable: true, maxLength: 20}
        address: {type: string, nullable: true, maxLength: 255}
        postalCode: {type: string, nullable: true, pattern: '^[0-9]{6}$'}
        preferredDialects: {type: string, nullable: true, maxLength: 100}
        livesAlone: {type: boolean, nullable: true}
        mobilityLevel: {type: string, nullable: true, enum: [INDEPENDENT, ASSISTIVE_CANE, WHEELCHAIR_BEDBOUND]}
    FamilyElderProfile:
      allOf:
        - {$ref: '#/components/schemas/FamilyElderBasicDetails'}
        - type: object
          required: [id, accessScope]
          properties:
            id: {type: integer, format: int64}
            accessScope: {type: string, enum: [FULL, READ_ONLY]}
    CaregiverCommandIdentity:
      type: object
      required: [expectedVersion, clientRequestId]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        clientRequestId: {type: string, format: uuid, description: Immutable command key; retain original payload and key when the result is unknown.}
    CaregiverIncidentCommand:
      allOf:
        - $ref: '#/components/schemas/CaregiverCommandIdentity'
        - type: object
          required: [visitId, category, severity, description]
          properties:
            visitId: {type: integer, format: int64, minimum: 1}
            category: {type: string, enum: [SOS, MEDICAL, FALL, SERVICE, OTHER]}
            severity: {type: string, enum: [LOW, MEDIUM, HIGH]}
            description: {type: string, minLength: 1, maxLength: 2000, description: Observed facts and actions; no diagnosis.}
    CaregiverIncidentReport:
      type: object
      required: [id, visitId, category, severity, description, status, reportedAt]
      properties:
        id: {type: integer, format: int64}
        visitId: {type: integer, format: int64}
        category: {type: string, enum: [SOS, MEDICAL, FALL, SERVICE, OTHER]}
        severity: {type: string, enum: [LOW, MEDIUM, HIGH]}
        description: {type: string}
        status: {type: string, enum: [OPEN, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, UNRESOLVED_ESCALATED]}
        reportedAt: {type: string, description: Singapore local date-time}
        respondBy: {type: string, nullable: true, description: Singapore local date-time; a deadline is not confirmation of take-over.}
        resolvedAt: {type: string, nullable: true, description: Singapore local date-time}
    CaregiverIncidentView:
      type: object
      required: [report, clientRequestId]
      properties:
        report: {$ref: '#/components/schemas/CaregiverIncidentReport'}
        clientRequestId: {type: string, format: uuid, nullable: true}
    CaregiverIncidentResult:
      allOf:
        - $ref: '#/components/schemas/CaregiverIncidentView'
        - type: object
          required: [visitVersion, replayed]
          properties:
            visitVersion: {type: integer}
            replayed: {type: boolean}
    CaregiverCheckInCommand:
      allOf:
        - $ref: '#/components/schemas/CaregiverCommandIdentity'
        - type: object
          required: [locationSource]
          description: GPS requires coordinates and nonnegative finite accuracy, without note; MANUAL_LOCATION_NOTE requires a nonblank note without GPS fields.
          properties:
            locationSource: {type: string, enum: [GPS, MANUAL_LOCATION_NOTE]}
            latitude: {type: number, minimum: -90, maximum: 90}
            longitude: {type: number, minimum: -180, maximum: 180}
            accuracy: {type: number, minimum: 0}
            locationNote: {type: string, maxLength: 500}
            clientCapturedAt: {type: string, format: date-time, description: Optional ISO instant; cannot override server check-in time.}
    CaregiverTaskResultCommand:
      allOf:
        - $ref: '#/components/schemas/CaregiverCommandIdentity'
        - type: object
          required: [status]
          properties:
            status: {type: string, enum: [DONE, SKIPPED, REFUSED]}
            outcome: {type: string, maxLength: 255, nullable: true}
            caregiverNote: {type: string, maxLength: 500, nullable: true, description: Nonblank factual reason required for SKIPPED or REFUSED.}
    CaregiverHealthFlag:
      type: string
      enum: [NO_CONCERN, ATTENTION, MEDICAL_REVIEW]
      description: Caregiver observation; NO_CONCERN means no concern marked, not a clinical normality assessment.
    CaregiverHealthObservation:
      type: object
      required: [healthFlag, healthNote]
      properties:
        healthFlag:
          type: string
          enum: [NO_CONCERN, ATTENTION, MEDICAL_REVIEW, null]
          nullable: true
          description: Null means not yet recorded; never default old visits to NO_CONCERN.
        healthNote: {type: string, nullable: true, maxLength: 1000}
    CaregiverHealthCommand:
      allOf:
        - $ref: '#/components/schemas/CaregiverCommandIdentity'
        - type: object
          required: [healthFlag]
          properties:
            systolic: {type: integer, nullable: true, minimum: 1, maximum: 999999, description: mmHg; supply together with diastolic.}
            diastolic: {type: integer, nullable: true, minimum: 1, maximum: 999999, description: mmHg; supply together with systolic.}
            pulse: {type: integer, nullable: true, minimum: 1, maximum: 999999, description: bpm.}
            temperature: {type: number, nullable: true, minimum: 0.01, maximum: 999999.99, multipleOf: 0.01, description: Celsius; bounds are storage limits, not clinical limits.}
            healthFlag: {$ref: '#/components/schemas/CaregiverHealthFlag'}
            healthNote: {type: string, nullable: true, maxLength: 1000, description: Nonblank for a concern or when no reading was measured.}
    CaregiverHealthRecord:
      type: object
      required: [id, visitId, healthFlag, healthNote, recordedAt, readings]
      properties:
        id: {type: integer, format: int64}
        visitId: {type: integer, format: int64}
        healthFlag: {$ref: '#/components/schemas/CaregiverHealthFlag'}
        healthNote: {type: string, nullable: true}
        recordedAt: {type: string, description: Server-generated Singapore local date-time.}
        readings:
          type: array
          maxItems: 4
          items:
            type: object
            required: [metric, value, unit]
            properties:
              metric: {type: string, enum: [systolic, diastolic, pulse, temperature]}
              value: {type: number}
              unit: {type: string, enum: [mmHg, bpm, °C]}
    CaregiverHealthResult:
      type: object
      required: [record, visitVersion, replayed]
      properties:
        record: {$ref: '#/components/schemas/CaregiverHealthRecord'}
        visitVersion: {type: integer, description: Original saved version; reload the work pack for the current version.}
        replayed: {type: boolean}
    CaregiverHealthPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CaregiverHealthRecord'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    CaregiverExecutionResult:
      type: object
      required: [visitId, visitVersion, savedState, taskId, replayed]
      properties:
        visitId: {type: integer, format: int64}
        visitVersion: {type: integer, description: 'Version of the original command, not necessarily current version on replay.'}
        savedState: {type: string, nullable: true, description: Original saved state; null for a task replay.}
        taskId: {type: integer, format: int64, nullable: true}
        replayed: {type: boolean}
    CaregiverExecutionContext:
      type: object
      properties:
        allowedActions: {type: array, items: {type: string, enum: [CHECK_IN, TASK_RESULT, HEALTH_RECORD, REPORT_INCIDENT]}}
        blockedReason: {type: string, nullable: true}
        serverNow: {type: string, description: Singapore local date-time}
        checkInOpensAt: {type: string, description: Singapore local date-time}
        checkInClosesAt: {type: string, description: Singapore local date-time}
        checkedInAt: {type: string, nullable: true}
        checkedOutAt: {type: string, nullable: true}
        lateArrival: {type: boolean}
        locationSource: {type: string, nullable: true, enum: [GPS, MANUAL_LOCATION_NOTE]}
    CaregiverSelfProfile:
      type: object
      required: [id, userId, fullName, status]
      properties:
        id: {type: integer, format: int64}
        userId: {type: integer, format: int64}
        fullName: {type: string}
        phone: {type: string, nullable: true}
        sector: {type: string, nullable: true}
        dialects: {type: string, nullable: true}
        status: {type: string, enum: [ONBOARDING, AVAILABLE, BUSY, INACTIVE]}
    CaregiverAssignedVisit:
      type: object
      required: [id, elderId, elderName, scheduledStart, status, version]
      properties:
        id: {type: integer, format: int64}
        elderId: {type: integer, format: int64}
        elderName: {type: string}
        serviceType: {type: string, nullable: true}
        scheduledStart: {type: string, description: Singapore local date-time, example: '2026-09-24T09:00:00'}
        scheduledEnd: {type: string, nullable: true, description: Singapore local date-time}
        status: {type: string, enum: [SCHEDULED, ARRIVED, IN_PROGRESS, COMPLETED, VERIFIED, AUTO_CLOSED, EXCEPTION, CANCELLED]}
        version: {type: integer}
    CaregiverSchedule:
      type: object
      required: [dateFrom, dateTo, timeZone, upcomingVisits, certificationAlerts, credentialAlertContext]
      properties:
        dateFrom: {type: string, format: date}
        dateTo: {type: string, format: date}
        timeZone: {type: string, enum: [Asia/Singapore]}
        upcomingVisits:
          type: array
          items: {$ref: '#/components/schemas/CaregiverAssignedVisit'}
        certificationAlerts:
          type: array
          items:
            type: object
            required: [id, name, expiryDate, status, warning, daysUntilExpiry, renewalState, renewalValidFrom]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
              certificateNo: {type: string, nullable: true}
              expiryDate: {type: string, format: date}
              status: {type: string, enum: [PUBLISHED, EXPIRING, EXPIRED]}
              warning: {type: string, enum: [EXPIRED, EXPIRING]}
              daysUntilExpiry: {type: integer, format: int64, description: Signed calendar days from the server assessment date; zero means valid through today.}
              renewalState: {type: string, enum: [NONE, PENDING_REVIEW, REJECTED, APPROVED_NOT_EFFECTIVE, REVOKED, CHECK_REQUIRED]}
              renewalValidFrom: {type: string, format: date, nullable: true, description: Present only for an approved future-effective renewal.}
        credentialAlertContext:
          type: object
          required: [asOfDate, warningDays, reviewRequired]
          properties:
            asOfDate: {type: string, format: date, description: Current server date in Asia/Singapore; independent of the selected roster dates.}
            warningDays: {type: integer, minimum: 0, description: Inclusive configurable expiry warning horizon.}
            reviewRequired: {type: boolean, description: Generic data-review notice without foreign credential details. An empty reminder list is not a compliance assertion.}
    CaregiverWorkPack:
      type: object
      required: [visit, elder, carePlanId, carePlanVersion, serviceInstructions, tasks, requiredEvidenceKinds]
      properties:
        healthObservation: {$ref: '#/components/schemas/CaregiverHealthObservation'}
        execution: {$ref: '#/components/schemas/CaregiverExecutionContext'}
        visit: {$ref: '#/components/schemas/CaregiverAssignedVisit'}
        elder:
          type: object
          required: [elderId, preferredName, languageNeeds]
          properties:
            elderId: {type: integer, format: int64}
            preferredName: {type: string}
            serviceAddress: {type: string, nullable: true}
            postalSector: {type: string, nullable: true}
            languageNeeds:
              type: array
              items: {type: string}
            accessNotes: {type: string, nullable: true}
            emergencyNotes: {type: string, nullable: true}
        carePlanId: {type: integer, format: int64, nullable: true}
        carePlanVersion: {type: integer, nullable: true}
        serviceInstructions:
          type: array
          description: Names/instructions of the plan nodes assigned to this visit, not the full care plan.
          items: {type: string}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/CaregiverExecutionTask'}
        requiredEvidenceKinds:
          type: array
          uniqueItems: true
          items: {type: string, enum: [CHECKLIST, PHOTO, READING]}
    CaregiverExecutionTask:
      type: object
      required: [id, visitId, name, status]
      properties:
        id: {type: integer, format: int64}
        visitId: {type: integer, format: int64}
        carePlanNodeId: {type: integer, format: int64, nullable: true}
        name: {type: string}
        status: {type: string, enum: [PENDING, DONE, SKIPPED, REFUSED]}
        outcome: {type: string, nullable: true}
        caregiverNote: {type: string, nullable: true}
        completedAt: {type: string, nullable: true, description: Singapore local date-time}
    ElderListItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
        - dateOfBirth
        - address
        - sector
        - planStatus
        - planVersion
        - nextVisitDate
      properties:
        id:
          type: integer
          format: int64
          description: Elder profile ID.
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        planStatus:
          type: string
          enum: [published, draft, none]
          description: Latest care plan state; absent, superseded or stopped plans are shown as none.
        planVersion:
          type: integer
          nullable: true
          description: Latest plan version; null when planStatus is none.
        nextVisitDate:
          type: string
          format: date
          nullable: true
          description: >-
            Next date derived from the published care plan on or after today, or null if none.
            This value does not establish that a dated visit record or caregiver assignment exists.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CurrentUserResponse:
