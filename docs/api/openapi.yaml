openapi: 3.0.3

info:
  title: CareLink API
  version: 0.0.1
  description: >-
    Caregiver slice 1 is implemented for GET /caregivers/me, GET /caregivers/me/schedule,
    and GET /visits/{visitId}/work-pack; these definitions supersede the matching draft operations.
    Includes the existing Auth contract and the specified FM01-FM05 family contracts. Family
    operations remain x-status: draft until implemented; inclusion in Final does not imply a working
    backend. Shared paths retain their non-family response alternatives. The family owner supplies
    only the family use-case behaviour; other use cases, binding management and platform
    implementation are outside this change.
  license:
    name: UNLICENSED

servers:
  - url: /api
    description: Same-origin, relative to whichever host serves the front end.

tags:
  - name: Auth
    description: Session-based sign-in and identity.

  - name: Elders
    description: Elder profiles visible to the current role.

  - name: Intake
    description: Intake applications and application progress, scoped to the current role.
  - name: Caregivers
    description: Caregiver profiles and credentials, scoped to the current role.
  - name: Visits
    description: Visit schedules, status, tasks and service timelines, scoped to the current role.
  - name: Incidents
    description: Incident details, view receipts and acknowledgement, with access defined per operation.
  - name: Reports
    description: Reports, weekly summaries and optional PDF export, scoped to the current role.
  - name: Notifications
    description: The current user's notification inbox and notification read state.

  - name: Absences
    description: Caregiver absences and the re-rostering they trigger (UC-MG04, with the family's part, the former UC-FM06, and the caregiver's request, UC-CG02).
  - name: Spot checks
    description: Home service spot checks with the family's consent and the caregiver's answer (UC-MG08, with the former UC-FM07).
paths:
  /family/service-applications:
    post:
      tags: [Intake]
      summary: Apply for care services for an already-bound elder (FM01)
      operationId: submitFamilyServiceApplication
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        Requires CSRF, an enabled FAMILY account and a current ACTIVE, unexpired FULL binding.
        The session determines the applicant. The server loads the existing elder and copies only
        basic details into an immutable snapshot; the caller cannot supply ownership, snapshot,
        review state or timestamps. Full name, home address and a six-digit postal code must be
        saved in My elders first. Other profile fields remain optional and are copied as recorded.
        At least one service need is required. Service text is trimmed and exact duplicates removed.
        Supports BATHING, VITALS and other described needs, as in the existing family form.
        Each accepted POST creates a distinct SUBMITTED request in care_service_application.
        Does not create an elder, account or care plan and is not consumed by the legacy intake approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FamilyServiceApplicationCreate'}
            example: {elderId: 1, careNeeds: [BATHING, VITALS], notes: 'Morning visits preferred.'}
      responses:
        '201':
          description: Transaction committed; the application is submitted and awaiting review.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyServiceApplication'}
        '400': {description: Invalid JSON types, unexpected fields or invalid input limits.}
        '401': {description: Authentication required.}
        '403': {description: CSRF failure, disabled family account or no current FULL binding.}
        '404': {description: Elder profile missing.}
        '409': {description: 'ELDER_PROFILE_INCOMPLETE; complete the saved name, address and six-digit postal code first.'}
        '500': {description: Persistence failed; submission success is not reported.}
    get:
      tags: [Intake]
      summary: List the current family's readable service applications
      operationId: listFamilyServiceApplications
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        Both applicant ownership and current readable elder bindings are applied before counting
        and pagination. FULL and READ_ONLY may read; revoked, rejected, pending or expired bindings
        cannot expose saved snapshots. Sorted by createdAt descending, then id descending.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Owned applications with current read access; empty when none match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyServiceApplicationPage'}
        '400': {description: Invalid pagination.}
        '401': {description: Authentication required.}
        '403': {description: Enabled family account and profile required.}
  /family/service-applications/{id}:
    get:
      tags: [Intake]
      summary: Read an owned service application and its original profile snapshot
      operationId: getFamilyServiceApplication
      x-status: implemented
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      description: >-
        Requires applicant ownership and a current readable binding to this elder. A later change
        to the elder's profile does not rewrite the submitted snapshot. Another family cannot read
        this application even if they are also bound to the same elder.
      responses:
        '200':
          description: Original submitted data, including an explicit UTC creation timestamp.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyServiceApplication'}
        '401': {description: Authentication required.}
        '403': {description: Current readable binding or enabled family account unavailable.}
        '404': {description: Application missing or owned by another family.}
  /family/elders:
    get:
      tags: [Elders]
      summary: List the family's currently bound elders and basic details
      operationId: listFamilyElderProfiles
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        Enabled FAMILY account required. Only ACTIVE, unexpired FULL or READ_ONLY bindings are included.
        Returns basic profiles in elder ID order; account IDs and internal clinical/care fields are excluded.
      responses:
        '200':
          description: Bound elder profiles; an empty array when none are readable.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FamilyElderProfile'}}
        '401': {description: Authentication required.}
        '403': {description: Enabled family account and family profile required.}
  /family/elders/{elderId}:
    parameters:
      - {name: elderId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [Elders]
      summary: Read basic details of a currently bound elder
      operationId: getFamilyElderProfile
      x-status: implemented
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Basic details with the current binding access scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyElderProfile'}
        '401': {description: Authentication required.}
        '403': {description: No current readable binding or enabled family account.}
        '404': {description: Elder profile missing.}
    put:
      tags: [Elders]
      summary: Maintain basic details of an elder with a FULL binding
      operationId: updateFamilyElderProfile
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        Requires CSRF and a current ACTIVE, unexpired FULL binding, rechecked on every save.
        Replaces only the listed basic details; omitted/null optional fields are cleared and blank text
        is normalized to null. A name is required, other details may be completed gradually.
        Never creates an elder, login or binding. Account linkage, medical notes, sector,
        continuity preference and care plans are not editable. Address changes do not reassign
        service sectors or existing visits; service coverage remains a manager responsibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FamilyElderBasicDetails'}
      responses:
        '200':
          description: Saved basic details and current access scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyElderProfile'}
        '400': {description: Invalid name, field length, date, postcode or enum value.}
        '401': {description: Authentication required.}
        '403': {description: CSRF failure or no current writable FULL binding.}
        '404': {description: Elder profile missing; no record is created.}
  /incidents:
    post:
      tags: [Incidents]
      summary: Submit a caregiver incident report (CG04)
      operationId: reportCaregiverIncident
      x-status: implemented
      x-implemented-roles: [CAREGIVER]
      security: [{sessionCookie: []}]
      description: >-
        Requires CSRF. Actor and elder are derived from the authenticated caregiver and current visit assignment.
        Open work pauses to EXCEPTION; terminal visits retain their state. SCHEDULED reports require the start
        time to have been reached. A UUID identifies one immutable command; equal retries return the original
        report without new notifications. Receipt status is read live; visitVersion identifies the original write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaregiverIncidentCommand'}
      responses:
        '201':
          description: Report created and routed through MG05 in the same transaction.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverIncidentResult'}
        '200':
          description: An identical successful command replayed; no additional business effects.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverIncidentResult'}
        '400': {description: Invalid request body.}
        '401': {description: Authentication required.}
        '403': {description: 'Wrong role, CSRF failure or no longer assigned.'}
        '404': {description: Visit not found.}
        '409': {description: State/version/command conflict; refresh before creating a different command.}
        '503': {description: Storage unavailable; reconcile saved results before retrying the same command.}
  /caregivers/me/incidents:
    get:
      tags: [Caregivers, Incidents]
      summary: Read reports submitted by this caregiver account
      operationId: getOwnCaregiverIncidentReports
      x-status: implemented
      security: [{sessionCookie: []}]
      description: Only source CAREGIVER and reportedByUserId equal to the session account; historical ownership survives visit reassignment. Sorted reportedAt/id descending.
      parameters:
        - {name: visitId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Safe own-report page, never a manager queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CaregiverIncidentView'}}
                  page: {type: integer}
                  size: {type: integer}
                  totalElements: {type: integer, format: int64}
        '400': {description: Invalid page or visit filter.}
        '401': {description: Authentication required.}
        '403': {description: Enabled caregiver account required.}
  /caregivers/me/incidents/{id}:
    get:
      tags: [Caregivers, Incidents]
      summary: Read a safe receipt for an incident this account reported
      operationId: getOwnCaregiverIncidentReport
      x-status: implemented
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Own report with live incident status, no responder identities or internal logs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverIncidentView'}
        '401': {description: Authentication required.}
        '403': {description: Enabled caregiver account required.}
        '404': {description: Missing or not submitted by this account; same unavailable response.}
  /visits/{visitId}/health-records:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    post:
      tags: [Visits]
      summary: Record measured vital signs and a caregiver health observation (CG03)
      operationId: recordCaregiverHealth
      x-status: implemented
      x-implemented-roles: [CAREGIVER]
      security: [{sessionCookie: []}]
      description: >-
        Requires CSRF, current assignment, a checked-in IN_PROGRESS visit and expectedVersion.
        Saves one immutable batch, all supplied readings, the latest visit health summary, a parent
        version increment and command receipt in one transaction. Blood pressure values are paired;
        pulse and temperature may be absent. If no readings were measured, explain why in healthNote.
        ATTENTION and MEDICAL_REVIEW require a note. Units, actor and Singapore recording time are
        server-selected. Replays retain the original key and payload and do not append readings.
        Normalise equal numeric values, including temperature 36.7/36.70, to the same command.
        No clinical threshold evaluation, incident notification, check-out or completion is implied.
        A valid original receipt may be replayed after the visit pauses, while assignment remains valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaregiverHealthCommand'}
      responses:
        '201':
          description: Measurement and observation saved atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverHealthResult'}
        '200':
          description: Original successful command replayed without further writes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverHealthResult'}
        '400': {description: Invalid measurement format or incomplete observation.}
        '401': {description: Authentication required.}
        '403': {description: Wrong role, assignment or CSRF token.}
        '404': {description: Visit not found.}
        '409': {description: State, version or command key conflict.}
        '503': {description: Storage unavailable; check saved results before retrying the original command.}
    get:
      tags: [Visits]
      summary: Read current-assignment health history
      operationId: getCaregiverHealthHistory
      x-status: implemented
      x-implemented-roles: [CAREGIVER]
      security: [{sessionCookie: []}]
      description: >-
        Current assigned caregiver only; cancelled visits are unavailable. Newest recordedAt/id first.
        Includes only real batches recorded since V20, not legacy demo readings without a batch.
        Does not expose recording staff IDs, command hashes or internal audit entries.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        '200':
          description: Assigned visit's paged health records.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverHealthPage'}
        '400': {description: Invalid pagination.}
        '401': {description: Authentication required.}
        '403': {description: Wrong role or not currently assigned.}
        '404': {description: Visit not found.}
        '409': {description: Visit cancelled.}
  /visits/{visitId}/check-in:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    post:
      tags: [Visits]
      summary: Record arrival and start assigned service (CG03 basics)
      operationId: caregiverVisitCheckIn
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        CAREGIVER only, CSRF required. Within configured early arrival (default 30 minutes) through scheduledEnd
        or Singapore day end. One transaction initializes only assigned plan-version tasks and records two APPLIED
        transitions SCHEDULED to ARRIVED to IN_PROGRESS. checkedInAt is server time. Manual location is explicitly
        unverified; GPS is device-supplied and no geofence is applied. No check-out or SYS03 scheduler is implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaregiverCheckInCommand'}
      responses:
        '200':
          description: Saved command result, or original result on identical replay; reload work-pack for current state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverExecutionResult'}
        '400': {description: Invalid location or command fields.}
        '401': {description: Authentication required.}
        '403': {description: 'CSRF, role or current assignment rejected.'}
        '404': {description: Visit not found.}
        '409': {description: 'Window, plan, state, version or command conflict. Authorized rejected state attempts are logged.'}
        '503': {description: Storage unavailable; check results before retry.}
  /visits/{visitId}/tasks/{taskId}/complete:
    parameters:
      - $ref: '#/components/parameters/VisitId'
      - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [Visits]
      summary: Record an assigned task result (CG03 basics)
      operationId: caregiverVisitTaskResult
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        CAREGIVER only, CSRF required, current assignment and IN_PROGRESS required. PENDING can become DONE,
        SKIPPED or REFUSED once. Only DONE sets completedAt and counts as completed; other results require a
        factual reason and retain null completedAt. Every write advances the parent Visit version. No task result
        completes the Visit. Identical successful commands replay without new timestamps; parent/task ownership
        is checked server-side, not selected through a client projection parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaregiverTaskResultCommand'}
      responses:
        '200':
          description: Original successful command result; reload tasks/work-pack for current state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverExecutionResult'}
        '400': {description: Invalid result or missing reason.}
        '401': {description: Authentication required.}
        '403': {description: 'Role, CSRF or assignment rejected.'}
        '404': {description: Visit or task not found in this visit.}
        '409': {description: 'State, version, task terminal result or command conflict.'}
        '503': {description: Storage unavailable; check results before retry.}
  /caregivers/me:
    get:
      tags: [Caregivers]
      operationId: getCurrentCaregiver
      summary: Read the caregiver profile linked to the session account
      x-status: implemented
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current caregiver profile; no caller-supplied caregiver id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverSelfProfile'}
        '401': {description: No authenticated session.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /caregivers/me/schedule:
    get:
      tags: [Caregivers]
      operationId: getCurrentCaregiverSchedule
      summary: Assigned visits and credential expiry reminders
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        CAREGIVER only. Uses visit.caregiver_id (current assignment), not assignment history.
        Includes CANCELLED summaries for the current assignee; their work packs are unavailable.
        Reassignment or unassignment removes the visit from the former caregiver's next query.
        Rescheduling moves it according to the new scheduledStart and the selected date range.
        Ordered by scheduledStart then id. Dates are inclusive Singapore calendar dates.
        Omit both for Singapore today through today+6; otherwise supply both, at most 31 days.
        Empty dates return an empty upcomingVisits array. Reminders are based on Singapore today,
        not the selected date range; default expiry warning horizon is 30 days.
        Reminders are ordered by expiryDate then id, independently of family credential ordering.
        Renewal replacement is a caregiver-only read projection: a linked same-owner/type published
        successor clears an old reminder only on or after its validFrom (null means no future-start
        restriction). An already-expired effective successor replaces the ancestor but is itself warned.
        Submitted, rejected, revoked and future-effective renewals do not clear old reminders.
        Cycles, ambiguous branches, missing/cross-owner/type links and inconsistent dates require
        manager review and never auto-clear reminders in the affected component. There are no writes
        to stored statuses. This is not credential approval or rostering eligibility.
      parameters:
        - name: dateFrom
          in: query
          schema: {type: string, format: date}
        - name: dateTo
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Schedule for the session caregiver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverSchedule'}
        '400': {description: 'Invalid, partial, reversed or over-31-day date range.'}
        '401': {description: No authenticated session.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /visits/{visitId}/work-pack:
    get:
      tags: [Visits]
      operationId: getAssignedVisitWorkPack
      summary: Read-only work pack for the currently assigned caregiver
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        CAREGIVER only and visit.caregiver_id must equal the session caregiver profile id.
        Ownership is checked before cancellation. A cancelled visit returns 409 with code
        VISIT_CANCELLED to its current assignee, without elder details, tasks or plan contents.
        Other caregivers still receive 403 without learning the cancellation state.
        Reads exactly visit.care_plan_id, including a superseded published version, never the
        elder's latest plan. Required evidence comes only from the assigned visit/task plan
        nodes and excludes NONE. Elder medicalNotes and family details are not exposed.
        Access/emergency notes are null until dedicated safe fields exist. Successful,
        missing and denied visit reads are audited independently of the read transaction.
        Local date-times in this read model are Singapore wall-clock values without an offset.
      parameters:
        - name: visitId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Read-only assigned work pack.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverWorkPack'}
        '400': {description: Invalid visit id format.}
        '401': {description: No authenticated session.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: VISIT_CANCELLED, or a visit references an unpublished/wrong-elder plan or nodes outside the bound plan.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}

  /auth/csrf:
    get:
      tags: [Auth]
      summary: Initialise browser CSRF protection
      x-status: implemented
      description: >-
        Call before login to obtain the XSRF-TOKEN cookie. Send that cookie and echo its value in
        the X-XSRF-TOKEN header for login and subsequent state-changing requests. This endpoint
        does not authenticate the caller.
      security: []
      responses:
        '200':
          description: CSRF token initialised; no response body.
          headers:
            Set-Cookie:
              description: XSRF-TOKEN cookie readable by the browser application.
              schema:
                type: string

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >
        Starts a server-side session on success. The session is carried by an
        HttpOnly `JSESSIONID` cookie set on the response; the front end does
        not read or manage it directly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`JSESSIONID`) and CSRF cookie (`XSRF-TOKEN`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >
            Invalid username or password. The two cases are not distinguished,
            so this response cannot be used to enumerate accounts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /elders:
    get:
      tags: [Elders]
      summary: List elders
      operationId: listElders
      x-status: implemented
      x-family-use-cases: [UC-FM02]
      security:
        - sessionCookie: []
      description: >-
        MANAGER callers receive every elder. FAMILY callers receive only elders linked to their
        current family profile by an ACTIVE binding with FULL or READ_ONLY access. The family
        account must currently be enabled and hold FAMILY. A binding is readable when expiresAt
        is absent or strictly later than the current time in Asia/Singapore; pending, rejected,
        revoked and expired bindings grant no access. Authorization is checked on every request.

        Both roles receive the same array of elder summaries. A family member with no readable
        elders receives 200 with an empty array. This operation has no pagination, search or sector
        filters. Identity comes from the authenticated session; no family ID or role parameter is
        accepted. This read-only GET requires no CSRF header.

        Validated requests reaching the FAMILY application query persist a READ record with
        the actor app_user ID (when resolvable), resource and outcome: OK, including empty
        results; DENIED for access refusal; or FAILED for lookup/query errors. Records
        commit independently with server occurred_at in Asia/Singapore. Authentication 401,
        method-role rejection 403 and MVC validation/conversion 400 rejected before the
        FAMILY application query are outside this audit. Existing request logging is
        unchanged. Audit storage failure returns 503 without protected data. Records
        exclude response bodies, raw query strings, exception details and secrets. Reading
        does not acknowledge notifications or incidents. The resource is ELDER with a null
        collection ID. MANAGER reads retain their existing behavior and are outside this
        family audit.
      responses:
        '200':
          description: Elder summaries visible to the current caller; an empty result is an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElderListItemResponse'
              examples:
                elders:
                  summary: Two readable elders, with and without a care plan
                  value:
                    - id: 101
                      fullName: Tan Mei
                      dateOfBirth: '1946-05-12'
                      address: 12 Example Road
                      sector: Central
                      planStatus: published
                      planVersion: 2
                      nextVisitDate: '2026-09-24'
                    - id: 102
                      fullName: Lim Wei
                      dateOfBirth: null
                      address: null
                      sector: null
                      planStatus: none
                      planVersion: null
                      nextVisitDate: null
                empty:
                  summary: No readable elders
                  value: []
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            The caller lacks a permitted role, or the family account is disabled, no longer
            holds FAMILY or has no family profile.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # Member 4: FM01-FM05 contracts; x-status records each operation's implementation status.
        '503':
          $ref: '#/components/responses/FamilyAuditUnavailable'
  /intake-applications:
    post:
      tags:
        - Intake
      summary: Submit an intake application
      x-status: implemented
      description: >-
        Submit an intake application as the current family member. Trim required text and reject
        blanks. Omitted mobilityLevel uses INDEPENDENT. Success creates only the application in
