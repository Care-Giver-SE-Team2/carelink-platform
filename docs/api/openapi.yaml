      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        elderId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Derived from the linked care resource. Null only for a notification about the account
            itself, never a bypass for unauthorised care content.
        eventType:
          type: string
        channel:
          type: string
          enum:
            - IN_APP
        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 1000
          nullable: true
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
            - SENT
            - READ
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
      description: >-
        A displayable in-app notification for the current user. SENT means available in the inbox, not
        email delivery. For an incident link, resourceType is incident and resourceId is the incident
        ID, not the notification ID.
