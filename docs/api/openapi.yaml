    ReportSection:
      type: object
      required:
        - title
        - body
      description: >-
        Every version has seven sections in this order - Overview, Services, Service completion,
        Vital signs, Observations, Incidents, Ratings and spot checks. Reports filed before V19
        have the middle four only, and read back with figures and series empty.
      properties:
        key:
          type: string
          description: Made from the title - overview, services, service-completion, vital-signs, observations, incidents, ratings-and-spot-checks.
          example: vital-signs
        title:
          type: string
          example: Service completion
        body:
          type: string
          description: Plain text, one item per line; an incident's timeline steps are indented by two spaces.
        figures:
          type: array
          description: The numbers the section states, filtered for the reader as the text is.
          items:
            $ref: '#/components/schemas/ReportFigure'
        series:
          type: array
          description: Vital signs only - one per metric. FAMILY has a point per day (that day's range); REGULATOR and INTERNAL have every reading.
          items:
            $ref: '#/components/schemas/ReportSeries'
