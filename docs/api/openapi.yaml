    FamilyIncidentDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        elderId:
          type: integer
          format: int64
        visitId:
          type: integer
          format: int64
          nullable: true
        source:
          $ref: '#/components/schemas/IncidentSource'
        category:
          $ref: '#/components/schemas/IncidentCategory'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        description:
          type: string
          nullable: true
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgeBy:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null without an FM05 personal window; legacy notifications do not establish one.
            The family member response deadline: first successfully created urgent IN_APP
            notification for this incident/family member plus the configured window (default two hours). Null when no
            response window was established, including when notification creation has not succeeded;
            null does not prevent an authorised read, view or acknowledgement. Stable across polling,
            email retries and further notifications for the same incident. Never the manager respondBy
            deadline. Later notification creation does not clear an existing acknowledgement or reopen
            waiting reminders.
        acknowledgement:
          $ref: '#/components/schemas/FamilyIncidentAcknowledgement'
      description: >-
        Safe incident facts and global handling status for the currently authorised family member.
        Notification existence or delivery is not an access prerequisite. No raw location coordinates,
        playbook, internal log, staff account IDs or other family acknowledgements.
      required:
        - id
        - elderId
        - visitId
        - source
        - category
        - severity
        - status
        - description
        - reportedAt
        - resolvedAt
        - acknowledgeBy
        - acknowledgement
    IncidentSource:
      type: string
      description: >-
        SYSTEM_MISSED_CHECKIN includes unassigned/leave-related system events and SYS03 assigned-but-overdue
        check-in alerts. SYS03 has an independent once-per-Visit durable trigger, defaults to strictly more than
        ten minutes after scheduledStart within a 24-hour lookback, and does not change Visit status.
      enum:
        - CAREGIVER
        - ELDER_SOS
        - ELDER_SERVICE_DISPUTE
        - SYSTEM_MISSED_CHECKIN
    IncidentCategory:
      type: string
      enum:
        - SOS
