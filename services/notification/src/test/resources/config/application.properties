# Read on top of application.properties for every test (classpath:/config/ comes after classpath:/).
#
# The integration tests build notification's own database from its own migrations, as a real run
# does, beside core's tables for the core stand-in (sg.nus.carelink.testsupport.OwnDatabaseForTests).
# Tests carry the login in MockMvc, not in Redis: the Redis session store and its health check are
# off, as in core's tests
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
management.health.redis.enabled=false
# core is its stand-in (sg.nus.carelink.testsupport.CoreStandIn); a call that still found the HTTP
# client would fail here rather than reach a core someone left running
carelink.core-api.base-url=http://core.invalid
# Encrypts webhook signing secrets in the tests' databases. A test-only key, protecting nothing but test data:
# "test-only-key-never-use-for-real" in base64. Real ones come from .env and the service's Secret
carelink.webhooks.encryption-key=dGVzdC1vbmx5LWtleS1uZXZlci11c2UtZm9yLXJlYWw=
