spring:
  application:
    name: notification
  datasource:
    # notification's own database; core's and the other services' are not reachable from here
    url: ${DB_URL:jdbc:mysql://localhost:3306/carelink_notification?connectionTimeZone=Asia/Singapore}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    hibernate:
      # The schema is the migrations'; Hibernate checks that the entities match it
      ddl-auto: validate
    open-in-view: false
  flyway:
    # db/migration here, then the platform's tables (shared.config.PlatformMigrationsAutoConfiguration)
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Shown at /actuator/info. APP_COMMIT is set by the Dockerfile from the commit the image was built from.
info:
  app:
    name: notification
    commit: ${APP_COMMIT:unknown}

logging:
  level:
    sg.nus.carelink: INFO
  pattern:
    # requestId and user are put in the MDC by RequestContextInterceptor (libs/shared)
    level: "%5p [%X{requestId:-}] [%X{user:-}]"
