spring:
  application:
    name: carelink
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/carelink?connectionTimeZone=Asia/Singapore}
    username: ${DB_USER:carelink}
    password: ${DB_PASSWORD:carelink}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validates it and never alters it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# UC-MG05 / UC-SYS02. The response countdown is institution policy, not a code constant,
# so it is set here; the defaults below match EscalationPolicy.defaults(). Countdowns are
# ISO-8601 durations. A responder reached after somebody else let their countdown expire
# gets later-level-multiplier times as long, because a second responder is a safety net
# rather than a competitor.
carelink:
  # SYS03: assigned but not checked in, once per Visit; does NOT close late check-in.
  missed-check-in:
    enabled: true
    scan-interval: PT60S
    scan-initial-delay: PT30S
    lookback: PT24H
    batch-size: 200
  caregiver:
    credential-warning-days: 30
    # SYS01. When the daily scan moves certificates to EXPIRING/EXPIRED and sends the alerts
    # (Spring cron, read in expiry-scan-zone; "-" switches it off).
    expiry-scan-cron: "0 0 0 * * *"
    expiry-scan-zone: Asia/Singapore
  escalation:
    countdown:
      HIGH: PT5M
      MEDIUM: PT15M
      LOW: PT60M
    later-level-multiplier: 2.0
    # How often the scan looks for expired countdowns, and how long it waits after start-up.
    scan-interval: PT60S
    scan-initial-delay: PT30S
  # UC-MG03. How many days ahead a published care plan's visits exist, and when the nightly
  # run rolls that window forward (Spring cron, read in schedule-zone; "-" switches it off).
  roster:
    horizon-days: 14
    schedule-cron: "0 0 0 * * *"
    schedule-zone: Asia/Singapore
    # How often a visit still unassigned at its start time is turned into an exception.
    uncovered-scan-interval: PT60S
    uncovered-scan-initial-delay: PT30S
    # A visit on approved leave still with the caregiver who is away this long before it
    # starts gets an incident, so a manager re-rosters it in time; how often that is checked.
    leave-reminder-lead: PT24H
    leave-reminder-interval: PT15M
    leave-reminder-initial-delay: PT2M
  # UC-MG04. How long a family has to answer a change before the default plan runs (the use
  # case: two hours by default, never a constant), how long before a visit its replacement
  # must know, how far back visits to an elder count as continuity and spot-check conclusions
  # count at all (UC-MG08: they feed rostering, never on their own), and how often the scan
  # looks for families whose time is up.
  rerostering:
    family-window: PT2H
    decision-lead: PT1H
    continuity-lookback: P180D
    spot-check-lookback: P90D
    scan-interval: PT60S
    scan-initial-delay: PT45S
  # UC-MG08 with the family's side (FM07 exception 1a): a request the family has not answered
  # stays open, never taken as a yes, and they are asked again once the last ask is this old.
  spot-checks:
    consent-reminder-after: P1D
    reminder-scan-interval: PT1H
    reminder-scan-initial-delay: PT3M

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Shown at /actuator/info. APP_COMMIT is set by the Dockerfile from the commit the
# image was built from; the deploy job compares it with the commit it just pushed.
info:
  app:
    name: carelink
    commit: ${APP_COMMIT:unknown}

logging:
  level:
    sg.nus.carelink: INFO
  pattern:
    # requestId and user are put in the MDC by RequestContextInterceptor, so every
    # line written while handling an API request says who and which request.
    level: "%5p [%X{requestId:-}] [%X{user:-}]"
