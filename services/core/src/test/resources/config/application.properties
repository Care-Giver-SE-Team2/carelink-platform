# Read on top of application.properties for every test (classpath:/config/ comes after classpath:/).
#
# Integration tests log in through MockMvc and carry the login in a MockHttpSession. Spring Session
# ignores that object and looks for its own cookie, so the tests keep the servlet container's
# in-memory session. SessionStoreIT switches the Redis session store back on and checks it.
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
# No Redis runs for the other tests, so its health check would turn /actuator/health DOWN
management.health.redis.enabled=false
