# Read on top of application.properties for every test (classpath:/config/ comes after classpath:/).
#
# Integration tests log in through MockMvc and carry the login in a MockHttpSession. Spring Session
# ignores that object and looks for its own cookie, so the tests keep the servlet container's
# in-memory session, and the Redis health check is off because no Redis runs for them.
# SessionStoreIT switches the Redis session store back on and checks it.
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
