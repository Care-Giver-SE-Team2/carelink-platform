# Read on top of application.properties for every test (classpath:/config/ comes after classpath:/).
#
# The integration tests build report's own database from its own migrations, as a real run does,
# beside core's tables for the core stand-in (sg.nus.carelink.testsupport.OwnDatabaseForTests).
# Tests carry the login in MockMvc, not in Redis: the Redis session store and its health check are
# off, as in core's tests
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
management.health.redis.enabled=false
# core and visit are test doubles (@MockitoBean CoreApi, VisitApi); nothing listens here
carelink.core-api.base-url=http://core.invalid
carelink.visit-api.base-url=http://visit.invalid
# The settlement job would start a minute in and call visit, which no test runs
carelink.value-added.settle-initial-delay=PT1H
