# Settings that make report one of the platform's services. Spring Boot reads this file on top of
# application.yml (classpath:/config/ comes after classpath:/).
#
# The Redis address comes from SPRING_DATA_REDIS_HOST and SPRING_DATA_REDIS_PORT (default
# localhost:6379); docker-compose.yml sets them for a local run.
spring:
  data:
    redis:
      repositories:
        # Redis holds sessions only; the repositories here are JPA repositories
        enabled: false
  session:
    data:
      redis:
        # The same namespace as core, so the login made through core is seen here
        namespace: carelink:session

carelink:
  core-api:
    # For a run outside Docker; overridden by CARELINK_COREAPI_BASEURL
    base-url: http://localhost:8080
  visit-api:
    # For a run outside Docker, where visit listens on 8081; overridden by CARELINK_VISITAPI_BASEURL
    base-url: http://localhost:8081
  open-platform:
    # The job API (/api/open/v1/jobs) checks the tokens notification issues, against notification's keys
    # (docs/section5/decisions.md, D15 and D16). For a run outside Docker, where notification listens on
    # 8083; overridden by CARELINK_OPENPLATFORM_JWKSETURI
    jwk-set-uri: http://localhost:8083/api/open/v1/.well-known/jwks.json
    issuer: carelink-open-platform
