# report in the cluster. Anything not set here comes from charts/carelink-service/values.yaml.
# Two replicas, one per availability zone. The weekly reports and the settlement of value-added
# services are scheduled jobs; ShedLock lets one replica at a time run each of them.
replicaCount: 2

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 768Mi

# core's and visit's internal APIs, and notification's token keys for the job API, at the Services the
# chart creates for their releases
env:
  CARELINK_COREAPI_BASEURL: http://core
  CARELINK_VISITAPI_BASEURL: http://visit
  CARELINK_OPENPLATFORM_JWKSETURI: http://notification/api/open/v1/.well-known/jwks.json
