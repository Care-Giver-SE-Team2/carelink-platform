spring:
  application:
    name: visit
  datasource:
    # visit's own database; core's and the other services' are not reachable from here
    url: ${DB_URL:jdbc:mysql://localhost:3306/carelink_visit?connectionTimeZone=Asia/Singapore}
    username: ${DB_USER:visit}
    password: ${DB_PASSWORD:visit}
  jpa:
    hibernate:
      # The schema is the migrations'; Hibernate checks that the entities match it
      ddl-auto: validate
    open-in-view: false
  flyway:
    # db/migration here, then the platform's tables (shared.config.PlatformMigrationsAutoConfiguration)
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
      # Deployment must set a private directory; the local default stays under the git-ignored target/.
      location: ${CARELINK_MULTIPART_TEMP:target/private/multipart}

carelink:
  caregiver:
    # Private visit evidence images (CG05); never served from the static web root. Deployments must persist it.
    evidence-storage: ${CARELINK_EVIDENCE_STORAGE:target/private/evidence}
  # SYS03: assigned but not checked in, once per visit; does NOT close late check-in.
  missed-check-in:
    enabled: true
    scan-interval: PT60S
    scan-initial-delay: PT30S
    lookback: PT24H
    batch-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Shown at /actuator/info. APP_COMMIT is set by the Dockerfile from the commit the image was built from.
info:
  app:
    name: visit
    commit: ${APP_COMMIT:unknown}

logging:
  level:
    sg.nus.carelink: INFO
  pattern:
    # requestId and user are put in the MDC by RequestContextInterceptor (libs/shared)
    level: "%5p [%X{requestId:-}] [%X{user:-}]"
