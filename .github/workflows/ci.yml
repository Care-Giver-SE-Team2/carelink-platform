name: CI

# Compare build inputs against a complete successful main release, rather than the last
# push (which might have failed). Shared build inputs invalidate all backend images.
# Every successful main CI assembles a complete release, including source-identical reuse.
#
# "Quality gate" is the one check branch protection requires: it passes when nothing that
# ran has failed, however many services ran.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'              # 18:00 UTC = 02:00 Singapore: new CVEs in old dependencies
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the services to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: python3 scripts/ci-release.py plan --directory "$RUNNER_TEMP/release-inputs"

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: release-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/release-inputs/
          retention-days: 7
          if-no-files-found: error

  service:
    name: Service
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/service.yml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  frontend:
    name: Front end lint, unit tests, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Record the static frontend release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-release/site"
          cp -R frontend/dist/. "$RUNNER_TEMP/frontend-release/site/"
          python3 scripts/frontend-release.py build --directory "$RUNNER_TEMP/frontend-release" --sha "$RELEASE_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-release/
          retention-days: 7
          if-no-files-found: error

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # scan the history, not just the working tree

      # The official image, run directly: the gitleaks Action needs a licence for
      # organisation repositories
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --verbose \
            --report-format=sarif --report-path=/repo/gitleaks.sarif

      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
          if-no-files-found: ignore

  deployment-config:
    name: Helm deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint and render all services in both environments
        run: scripts/check-deploy.sh

      - name: Check release manifests and runtime configuration injection offline
        run: python3 -m unittest discover -s scripts/tests -v

  iac-security:
    name: Checkov IaC security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/checkov-requirements.txt

      - name: Install the pinned scanner
        run: python -m pip install --disable-pip-version-check -r .github/checkov-requirements.txt

      - name: Scan tracked Terraform and reject new findings
        run: python3 scripts/scan-iac.py --output "$RUNNER_TEMP/checkov-iac"

      - name: Publish the scan summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/checkov-iac/summary.md" ]; then
            cat "$RUNNER_TEMP/checkov-iac/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep full and differential reports even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-iac
          path: ${{ runner.temp }}/checkov-iac/
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: Quality gate
    needs: [changes, service, frontend, secret-scan, deployment-config, iac-security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the results
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          SERVICE_RESULT: ${{ needs.service.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECRETS_RESULT: ${{ needs.secret-scan.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-config.result }}
          IAC_RESULT: ${{ needs.iac-security.result }}
        run: |
          {
            echo "### Quality gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Services $SERVICES | $SERVICE_RESULT |"
            echo "| Front end | $FRONTEND_RESULT |"
            echo "| Secret scanning | $SECRETS_RESULT |"
            echo "| Helm deployment configuration | $DEPLOYMENT_RESULT |"
            echo "| Checkov IaC security (new findings gate) | $IAC_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if anything that ran failed
        if: needs.iac-security.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  publish:
    name: Publish to ECR
    needs: [changes, gate]
    if: always() && needs.gate.result == 'success' && needs.changes.outputs.services != '[]' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
      PUBLISH_ROLE: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check repository variables
        id: config
        run: |
          : "${IMAGE_REGISTRY:?Set the ECR_REGISTRY repository variable.}"
          : "${PUBLISH_ROLE:?Set the AWS_ECR_PUBLISH_ROLE_ARN repository variable.}"
          account=${IMAGE_REGISTRY%%.*}
          [[ "$account" =~ ^[0-9]{12}$ ]]
          [[ "$IMAGE_REGISTRY" == "$account.dkr.ecr.ap-southeast-1.amazonaws.com" ]]
          echo "account=$account" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/ecr-image

      - name: Load the image that passed the quality gate
        run: docker load -i "$RUNNER_TEMP/ecr-image/image.tar"

      - name: Request temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE }}
          aws-region: ap-southeast-1
          role-duration-seconds: 900
          role-session-name: carelink-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ steps.config.outputs.account }}

      - name: Publish the verified image and record its digest
        env:
          IMAGE_RECORD: ${{ runner.temp }}/image-record.json
        run: |
          scripts/push-image.sh "$SERVICE"
          {
            echo "### $SERVICE image"
            jq -r '"Image: `\(.image)@\(.digest)`"' "$IMAGE_RECORD"
            echo ""
            echo "Publication succeeded; runtime deployment and image vulnerability gating are separate steps."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the image reference for deployment
        uses: actions/upload-artifact@v7
        with:
          name: ecr-reference-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-record.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  release:
    name: Complete verified release
    needs: [changes, gate, publish]
    if: >-
      always() && needs.gate.result == 'success' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && needs.changes.outputs.services == '[]')) &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/release-inputs
      - name: Verify all image sources and assemble the complete frontend/backend release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: python3 scripts/ci-release.py assemble --inputs "$RUNNER_TEMP/release-inputs" --directory "$RUNNER_TEMP/verified-release"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/verified-release/
          retention-days: 7
          if-no-files-found: error
