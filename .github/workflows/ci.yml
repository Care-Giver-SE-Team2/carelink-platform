name: CI

# The entry point of the pipeline. It works out which services a commit touched and runs the
# shared service pipeline (service.yml) once for each of them. A change to anything the
# services share (the parent pom, build/, charts/, libs/, docs/api/, the build script, these
# two workflows) runs it for every service. The front end and the secret scan cover the whole
# repository and run alongside.
#
# "Quality gate" is the one check branch protection requires: it passes when nothing that
# ran has failed, however many services ran.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'              # 18:00 UTC = 02:00 Singapore: new CVEs in old dependencies
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the services to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(for pom in services/*/pom.xml; do basename "$(dirname "$pom")"; done)
          # No usable base commit (manual or nightly run, first push, force push): everything
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ] \
             || ! git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          shared='^(pom\.xml|mvnw|\.mvn/|build/|charts/|libs/|docs/api/|scripts/(build|push-image)\.sh|\.github/workflows/(ci|service)\.yml)'
          if grep -qE "$shared" <<<"$changed"; then
            picked=$all
          else
            picked=$(for s in $all; do grep -q "^services/$s/" <<<"$changed" && echo "$s"; done || true)
          fi
          services=$(printf '%s\n' "$picked" | jq -Rsc 'split("\n") | map(select(length > 0))')
          frontend=$(grep -qE '^(frontend/|scripts/frontend-release\.py|\.github/workflows/ci\.yml)' <<<"$changed" && echo true || echo false)
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "services: $services  front end: $frontend"

  service:
    name: Service
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/service.yml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  frontend:
    name: Front end lint, unit tests, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Record the static frontend release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-release/site"
          cp -R frontend/dist/. "$RUNNER_TEMP/frontend-release/site/"
          python3 scripts/frontend-release.py build --directory "$RUNNER_TEMP/frontend-release" --sha "$RELEASE_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-release/
          retention-days: 7
          if-no-files-found: error

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # scan the history, not just the working tree

      # The official image, run directly: the gitleaks Action needs a licence for
      # organisation repositories
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --verbose \
            --report-format=sarif --report-path=/repo/gitleaks.sarif

      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
          if-no-files-found: ignore

  deployment-config:
    name: Helm deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint and render all services in both environments
        run: scripts/check-deploy.sh

      - name: Check release manifests and runtime configuration injection offline
        run: python3 -m unittest discover -s scripts/tests -v

  gate:
    name: Quality gate
    needs: [changes, service, frontend, secret-scan, deployment-config]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the results
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          SERVICE_RESULT: ${{ needs.service.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECRETS_RESULT: ${{ needs.secret-scan.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-config.result }}
        run: |
          {
            echo "### Quality gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Services $SERVICES | $SERVICE_RESULT |"
            echo "| Front end | $FRONTEND_RESULT |"
            echo "| Secret scanning | $SECRETS_RESULT |"
            echo "| Helm deployment configuration | $DEPLOYMENT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if anything that ran failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  publish:
    name: Publish to ECR
    needs: [changes, gate]
    if: needs.gate.result == 'success' && needs.changes.outputs.services != '[]' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
      PUBLISH_ROLE: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check repository variables
        id: config
        run: |
          : "${IMAGE_REGISTRY:?Set the ECR_REGISTRY repository variable.}"
          : "${PUBLISH_ROLE:?Set the AWS_ECR_PUBLISH_ROLE_ARN repository variable.}"
          account=${IMAGE_REGISTRY%%.*}
          [[ "$account" =~ ^[0-9]{12}$ ]]
          [[ "$IMAGE_REGISTRY" == "$account.dkr.ecr.ap-southeast-1.amazonaws.com" ]]
          echo "account=$account" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/ecr-image

      - name: Load the image that passed the quality gate
        run: docker load -i "$RUNNER_TEMP/ecr-image/image.tar"

      - name: Request temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE }}
          aws-region: ap-southeast-1
          role-duration-seconds: 900
          role-session-name: carelink-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ steps.config.outputs.account }}

      - name: Publish the verified image and record its digest
        env:
          IMAGE_RECORD: ${{ runner.temp }}/image-record.json
        run: |
          scripts/push-image.sh "$SERVICE"
          {
            echo "### $SERVICE image"
            jq -r '"Image: `\(.image)@\(.digest)`"' "$IMAGE_RECORD"
            echo ""
            echo "Publication succeeded; runtime deployment and image vulnerability gating are separate steps."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the image reference for deployment
        uses: actions/upload-artifact@v7
        with:
          name: ecr-reference-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-record.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
