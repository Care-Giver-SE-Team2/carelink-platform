name: Deploy staging

# Manual during the short-lived demonstration window. The organization runner
# group must restrict workflow access to this file on refs/heads/main.
on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: Successful main CI run containing the core ECR reference
        required: true
        type: string
      visit_run_id:
        description: CI run for visit (blank reuses core_run_id)
        type: string
      report_run_id:
        description: CI run for report (blank reuses core_run_id)
        type: string
      notification_run_id:
        description: CI run for notification (blank reuses core_run_id)
        type: string

permissions:
  contents: read

concurrency:
  group: carelink-staging-deployment
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified publication records and assemble the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
          VISIT_RUN_ID: ${{ inputs.visit_run_id || inputs.core_run_id }}
          REPORT_RUN_ID: ${{ inputs.report_run_id || inputs.core_run_id }}
          NOTIFICATION_RUN_ID: ${{ inputs.notification_run_id || inputs.core_run_id }}
        run: bash scripts/prepare-deployment-release.sh "$RUNNER_TEMP/release.json"

      - uses: actions/upload-artifact@v7
        with:
          name: staging-release
          path: ${{ runner.temp }}/release.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: release
    if: github.ref == 'refs/heads/main' && vars.CARELINK_MAC_DEPLOY_ENABLED == 'true'
    runs-on:
      group: carelink-deployment
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
      DEPLOY_ROLE: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      KUBE_CONTEXT: carelink-staging-deploy
      AWS_PROFILE: ''
      AWS_DEFAULT_PROFILE: ''
      IMAGE_TAG: ''
      DRY_RUN: '0'
      PUBLIC_HTTPS: ${{ vars.CARELINK_PUBLIC_HTTPS_ENABLED || 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the runner and prepare isolated configuration files
        id: config
        run: |
          for tool in aws kubectl helm python3; do command -v "$tool"; done
          : "${IMAGE_REGISTRY:?Set ECR_REGISTRY}"
          : "${DEPLOY_ROLE:?Set AWS_STAGING_DEPLOY_ROLE_ARN}"
          account=${IMAGE_REGISTRY%%.*}
          [[ "$account" =~ ^[0-9]{12}$ ]]
          [[ "$IMAGE_REGISTRY" == "$account.dkr.ecr.ap-southeast-1.amazonaws.com" ]]
          [[ "$DEPLOY_ROLE" == "arn:aws:iam::$account:role/CareLinkGitHubStagingDeploy" ]]
          AWS_CONFIG_FILE="$RUNNER_TEMP/carelink-deploy-aws-config"
          AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/carelink-deploy-aws-credentials"
          KUBECONFIG="$RUNNER_TEMP/carelink-deploy-kubeconfig"
          umask 077
          : > "$AWS_CONFIG_FILE"
          : > "$AWS_SHARED_CREDENTIALS_FILE"
          : > "$KUBECONFIG"
          {
            echo "AWS_CONFIG_FILE=$AWS_CONFIG_FILE"
            echo "AWS_SHARED_CREDENTIALS_FILE=$AWS_SHARED_CREDENTIALS_FILE"
            echo "KUBECONFIG=$KUBECONFIG"
            echo "RELEASE_MANIFEST=$RUNNER_TEMP/staging-release/release.json"
          } >> "$GITHUB_ENV"
          echo "account=$account" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: staging-release
          path: ${{ runner.temp }}/staging-release

      - name: Obtain temporary deployment credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
          role-session-name: carelink-deploy-${{ github.run_id }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
          unset-current-credentials: true
          translate-env-variables: false
          action-timeout-s: 120

      - name: Configure access to the existing cluster
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          aws eks update-kubeconfig --region ap-southeast-1 --name carelink-runtime \
            --alias "$KUBE_CONTEXT" --kubeconfig "$KUBECONFIG"

      - name: Verify the release and deploy four services
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          bash scripts/deploy-release.sh staging

      - name: Record the deployment result
        if: always()
        env:
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          {
            echo "### Staging deployment: $DEPLOY_RESULT"
            echo "Release manifest: staging-release artifact in this workflow run."
            echo "Helm readiness is not a business smoke test; record business acceptance separately."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove job configuration files
        if: always()
        run: rm -f "$RUNNER_TEMP/carelink-deploy-aws-config" "$RUNNER_TEMP/carelink-deploy-aws-credentials" "$RUNNER_TEMP/carelink-deploy-kubeconfig"
