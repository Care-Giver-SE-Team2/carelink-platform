name: Deploy staging

# Deploy the exact successful main CI release; retain manual dispatch for rollback.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      core_run_id:
        description: Successful main CI run containing the core ECR reference
        required: true
        type: string
      visit_run_id:
        description: CI run for visit (blank reuses core_run_id)
        type: string
      report_run_id:
        description: CI run for report (blank reuses core_run_id)
        type: string
      notification_run_id:
        description: CI run for notification (blank reuses core_run_id)
        type: string

permissions:
  contents: read

concurrency:
  group: carelink-staging-deployment
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.CARELINK_AUTO_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the CI source and reject superseded automatic releases
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.core_run_id }}
          AUTOMATIC_DEPLOY: ${{ github.event_name == 'workflow_run' }}
        run: python3 scripts/select-ci-release.py >> "$GITHUB_OUTPUT"

      - name: Download verified publication records and assemble the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && steps.source.outputs.sha || '' }}
          INCREMENTAL_RELEASE: ${{ github.event_name == 'workflow_run' }}
          CI_RUN_ID: ${{ steps.source.outputs.run_id }}
          CORE_RUN_ID: ${{ github.event.workflow_run.id || inputs.core_run_id }}
          VISIT_RUN_ID: ${{ github.event.workflow_run.id || inputs.visit_run_id || inputs.core_run_id }}
          REPORT_RUN_ID: ${{ github.event.workflow_run.id || inputs.report_run_id || inputs.core_run_id }}
          NOTIFICATION_RUN_ID: ${{ github.event.workflow_run.id || inputs.notification_run_id || inputs.core_run_id }}
        run: bash scripts/prepare-deployment-release.sh "$RUNNER_TEMP/staging-release/release.json"

      - uses: actions/upload-artifact@v7
        with:
          name: staging-release
          path: ${{ runner.temp }}/staging-release/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: release
    if: github.ref == 'refs/heads/main' && vars.CARELINK_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      IMAGE_REGISTRY: ${{ vars.ECR_REGISTRY }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOY_INPUT_BUCKET: ${{ vars.CARELINK_DEPLOY_INPUT_BUCKET }}
      CODEBUILD_PROJECT: ${{ vars.CARELINK_CODEBUILD_PROJECT }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: staging-release
          path: ${{ runner.temp }}/staging-release

      - name: Reject a superseded automatic release before deployment
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ needs.release.outputs.run_id }}
          AUTOMATIC_DEPLOY: 'true'
        run: python3 scripts/select-ci-release.py

      - name: Obtain temporary deployment trigger credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: carelink-deploy-${{ github.run_id }}
          unset-current-credentials: true

      - name: Deploy the verified backend release inside the existing VPC
        run: python3 scripts/run-codebuild-deployment.py "$RUNNER_TEMP/staging-release/release.json"


  frontend:
    needs: [release, deploy]
    if: github.event_name == 'workflow_run'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      frontend_run_id: ${{ needs.release.outputs.run_id }}
      release_sha: ${{ needs.release.outputs.sha }}

  acceptance:
    needs: [release, deploy, frontend]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.sha }}
      - name: Verify the public commit, login and four-service reads
        env:
          CARELINK_PUBLIC_URL: ${{ vars.CARELINK_PUBLIC_URL }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          CARELINK_SMOKE_PASSWORD: ${{ secrets.CARELINK_SMOKE_PASSWORD }}
        run: python3 scripts/check-public-deployment.py
