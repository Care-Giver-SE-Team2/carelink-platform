name: CG-01 MySQL acceptance

# Independent of the fast pipeline. No Sonar, publishing, secrets or deployment.
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/core/**'
      - 'frontend/**'
      - 'scripts/*caregiver*'
      - 'deploy/caregiver-demo/**'
      - '.github/workflows/caregiver-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: caregiver-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mysql-acceptance:
    name: CG-01 full MySQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit, architecture and full real MySQL integration suite
        working-directory: services/core
        run: ./mvnw -B -ntp clean verify -Pintegration
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cg01-mysql-acceptance
          path: |
            services/core/target/surefire-reports/
            services/core/target/failsafe-reports/
            services/core/target/site/jacoco/
          retention-days: 7
